<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ДіноКорд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: Discord-style — server rail, channel list, chat, member list. Rooms go over PeerJS (the host relays and keeps history). */
:root {
  --rail: #1e1f22; --side: #2b2d31; --chat: #313338; --input: #383a40; --hover: #35373c; --sel: #404249;
  --ink: #dbdee1; --muted: #949ba4; --head: #f2f3f5; --line: #1f2023;
  --accent: #5865f2; --accent-2: #4752c4; --ok: #23a55a; --danger: #f23f43; --dino: #ffbf3a;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --rail: #e3e5e8; --side: #f2f3f5; --chat: #ffffff; --input: #ebedef; --hover: #e8eaed; --sel: #d7dadf;
    --ink: #313338; --muted: #5c5e66; --head: #060607; --line: #e1e2e4; --dino: #c98400; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --rail: #e3e5e8; --side: #f2f3f5; --chat: #ffffff; --input: #ebedef; --hover: #e8eaed; --sel: #d7dadf;
  --ink: #313338; --muted: #5c5e66; --head: #060607; --line: #e1e2e4; --dino: #c98400; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; background: var(--chat); color: var(--ink); font: 15px/1.4 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; color: var(--ink); }

.app { display: grid; grid-template-columns: 72px 240px minmax(0, 1fr) 240px; grid-template-rows: minmax(0, 1fr); height: var(--vh, 100dvh); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; }

/* server rail */
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; }
.srv { width: 48px; height: 48px; border-radius: 50%; background: var(--side); display: grid; place-items: center; font: 600 16px var(--body); font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink); transition: border-radius .15s, background .15s; flex: none; position: relative; }
.srv:hover, .srv.on { border-radius: 16px; background: var(--accent); color: #fff; }
.srv.on::before { content: ""; position: absolute; left: -12px; width: 4px; height: 36px; border-radius: 0 4px 4px 0; background: var(--head); }
.srv.add { color: var(--ok); font-size: 26px; }
.srv.busy { opacity: .5; }
.srv.num { font-size: 13px; letter-spacing: 0; }
.rail { scrollbar-width: none; }
.srv.add:hover { background: var(--ok); color: #fff; }
.rail hr { width: 32px; border: 0; border-top: 2px solid var(--side); margin: 2px 0; }

/* channel side */
.side { background: var(--side); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.side-head { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--head); gap: 8px; }
.side-head .code { font: 600 13px var(--body); font-variant-numeric: tabular-nums; color: var(--dino); white-space: nowrap; }
.chans { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 12px 8px; }
.cat { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; letter-spacing: .02em; }
.chan { display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; border-radius: 4px; color: var(--muted); text-align: left; }
.chan:hover { background: var(--hover); color: var(--ink); }
.chan.on { background: var(--sel); color: var(--head); }
.chan .hash { font-size: 20px; line-height: 1; opacity: .7; width: 22px; text-align: center; flex: none; }
.chan .hash.ic { font-size: 15px; }
.chan .unread { margin-left: auto; background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; border-radius: 8px; padding: 0 6px; }
.me-bar { background: color-mix(in srgb, var(--rail) 60%, var(--side)); padding: 8px; display: flex; align-items: center; gap: 8px; }
.me-bar input { flex: 1; min-width: 0; background: var(--input); border: 0; border-radius: 4px; padding: 6px 8px; outline: none; }
.icon-btn { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-size: 18px; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }

/* avatars */
.ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 22px; position: relative; }
.ava.sm { width: 32px; height: 32px; font-size: 17px; }
.ava .dot { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ok); border: 3px solid var(--side); }
.ava .dot.away { background: #f0b232; }
.ava .dot.dnd { background: var(--danger); }
.member .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; margin-right: 4px; }
.img-msg { display: block; margin-top: 4px; padding: 0; border-radius: 8px; overflow: hidden; max-width: min(360px, 100%); background: var(--input); }
.img-msg img { display: block; width: 100%; height: auto; max-height: 360px; object-fit: contain; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: #000e; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.lightbox button { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; background: #0009; color: #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; }
.msgs.drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
.voice-msg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.voice-msg audio { height: 36px; max-width: 100%; }
.voice-msg .len { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.gone { color: var(--muted); font-style: italic; }
#btnRec.rec { color: var(--danger); width: auto; padding: 0 8px; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.st-row { display: flex; gap: 6px; margin-top: 6px; }
.st-row button { flex: 1; padding: 8px 6px; border-radius: 6px; background: var(--input); font-size: 13px; }
.st-row button.on { outline: 2px solid var(--accent); }

/* chat */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat); position: relative; }
.main-head { flex: none; height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); color: var(--head); font-weight: 600; }
.main-head .hash { color: var(--muted); font-size: 22px; }
#chanName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.main-head .topic { color: var(--muted); font-weight: 400; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-left: 1px solid var(--sel); padding-left: 10px; margin-left: 4px; }
.main-head .sp { flex: 1; }
.live-btn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 4px; background: var(--input); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
.live-btn:hover { background: var(--sel); }
.live-btn.on { background: var(--danger); color: #fff; }
.live-btn[hidden] { display: none; }
.stage { background: #000; position: relative; flex: none; border-bottom: 1px solid var(--line); }
.stage video { display: block; width: 100%; max-height: 52vh; background: #000; }
.stage .cap { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; background: #000a; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 13px; max-width: calc(100% - 120px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stage .cap::before { content: "НАЖИВО"; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; letter-spacing: .04em; }
.stage .ctl { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.stage .ctl button { background: #000a; color: #fff; border-radius: 4px; padding: 3px 8px; font-size: 13px; }
.lv { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 4px; text-align: left; color: var(--ink); min-width: 0; }
.lv:hover { background: var(--hover); }
.lv .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.lv .tag { background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex: none; }
.menu-btn { display: none; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px 0 8px; }
.welcome { padding: 16px; }
.welcome .big { width: 68px; height: 68px; border-radius: 50%; background: var(--sel); display: grid; place-items: center; font-size: 38px; margin-bottom: 8px; }
.welcome h2 { margin: 0 0 4px; color: var(--head); font-size: 28px; }
.welcome p { margin: 0; color: var(--muted); }
.msg { display: flex; gap: 16px; padding: 2px 16px; margin-top: 14px; position: relative; }
.msg.cont { margin-top: 0; }
.msg.cont .ava { visibility: hidden; height: 0; }
.msg:hover { background: color-mix(in srgb, var(--rail) 18%, transparent); }
.msg .body { min-width: 0; flex: 1; }
.msg .who { font-weight: 600; margin-right: 6px; }
.msg .time { color: var(--muted); font-size: 12px; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.sys .text { color: var(--muted); font-style: italic; }
.msg .text .ping { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--head); border-radius: 3px; padding: 0 2px; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.react { background: var(--input); border: 1px solid transparent; border-radius: 8px; padding: 0 6px; font-size: 14px; }
.react.mine { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--input)); }
.msg .tools { position: absolute; right: 16px; top: -14px; display: none; background: var(--chat); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 8px #0003; }
.msg:hover .tools, .msg:focus-within .tools { display: flex; }
.msg .tools button { padding: 4px 6px; font-size: 16px; }
.msg .tools button:hover { background: var(--hover); }
.typing { height: 22px; padding: 0 16px; font-size: 13px; color: var(--muted); }
.composer { padding: 0 16px 20px; }
.reply-bar { display: flex; align-items: center; gap: 8px; background: var(--side); border-radius: 8px 8px 0 0; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.reply-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-bar b { color: var(--ink); }
.reply-bar + form { border-top-left-radius: 0; border-top-right-radius: 0; }
.quote { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 2px; cursor: pointer; min-width: 0; padding: 0; text-align: left; max-width: 100%; }
.quote::before { content: ""; width: 18px; height: 9px; border: 2px solid var(--sel); border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; margin-top: 6px; flex: none; }
.quote b { color: var(--ink); font-weight: 600; flex: none; }
.quote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.msg.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 25%, transparent); } }
.msg .text a { color: var(--accent); text-decoration: underline; word-break: break-all; }
.invite { width: 100%; background: var(--input); border: 0; border-radius: 4px; padding: 10px; color: var(--ink); font: 13px var(--body); }
.composer form { display: flex; align-items: center; gap: 8px; background: var(--input); border-radius: 8px; padding: 0 8px 0 12px; }
.composer input { flex: 1; min-width: 0; background: none; border: 0; outline: none; padding: 11px 0; }
.composer input:disabled { opacity: .5; }

/* members */
.members { background: var(--side); min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px 8px; }
.member { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; }
.member:hover { background: var(--hover); }
.member .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member .tag { font-size: 11px; font-weight: 600; color: var(--dino); }

/* dialog */
.ov { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; padding: 16px; z-index: 10; }
.ov[hidden] { display: none; }
.dlg { background: var(--chat); border-radius: 8px; width: min(440px, 100%); padding: 24px; text-align: center; box-shadow: 0 8px 32px #0006; }
.dlg h2 { margin: 0 0 6px; color: var(--head); font-family: var(--display); font-size: 26px; }
.dlg p { margin: 0 0 16px; color: var(--muted); }
.dlg label { display: block; text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
.dlg input { width: 100%; background: var(--input); border: 0; border-radius: 4px; padding: 10px; outline: none; }
.dlg .row { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; padding: 10px 16px; border-radius: 4px; background: var(--accent); color: #fff; font-weight: 500; }
.btn:hover { background: var(--accent-2); }
.btn.sec { background: var(--sel); color: var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.adm { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.adm .btn { flex: none; width: 100%; }
.btn.danger { background: var(--danger); }
.adm-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--sel); }
.adm-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-row button { flex: none; padding: 4px 10px; border-radius: 4px; background: var(--sel); font-size: 13px; }
.adm h3 { margin: 12px 0 2px; font-size: 12px; text-transform: uppercase; color: var(--muted); }
.member.can { cursor: pointer; }
.side-head .gear { margin-left: auto; font-size: 16px; }
#srvName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.status { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.status.bad { color: var(--danger); }
.emojis { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.emojis button { font-size: 24px; width: 42px; height: 42px; border-radius: 8px; background: var(--input); }
.emojis button.on { outline: 2px solid var(--accent); }

/* voice */
.vchan { display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; border-radius: 4px; color: var(--muted); text-align: left; }
.vchan:hover { background: var(--hover); color: var(--ink); }
.vchan.on { color: var(--head); }
.vlist { padding: 2px 0 6px 30px; display: flex; flex-direction: column; gap: 2px; }
.vuser { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-width: 0; }
.vuser .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vuser .ava { width: 24px; height: 24px; font-size: 13px; box-shadow: 0 0 0 2px transparent; transition: box-shadow .1s; }
.vuser.talk .ava { box-shadow: 0 0 0 2px var(--ok); }
.vuser .mic { margin-left: auto; font-size: 12px; }
.vbar { background: color-mix(in srgb, var(--rail) 60%, var(--side)); border-bottom: 1px solid var(--line); padding: 8px; display: flex; align-items: center; gap: 6px; }
.vbar .st { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; }
.vbar .st b { display: block; color: var(--ok); font-weight: 600; }
.vbar .st span { color: var(--muted); }
.vbar .icon-btn.off { color: var(--danger); }
.vbar .hang { color: var(--danger); }
@media (max-width: 1000px) { .app { grid-template-columns: 72px 220px minmax(0, 1fr); } .members { display: none; } }
.to-bottom { position: absolute; right: 24px; bottom: 96px; z-index: 3; background: var(--accent); color: #fff; border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px #0004; }
.typing, .composer { flex: none; }
@media (max-width: 700px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail, .side { position: fixed; top: 0; bottom: 0; z-index: 5; padding-top: env(safe-area-inset-top, 0px); transform: translateX(-110vw); transition: transform .2s; }
  .rail { left: 0; width: 72px; }
  .side { left: 72px; width: min(260px, calc(100vw - 72px)); }
  .app.drawer .rail, .app.drawer .side { transform: none; }
  .menu-btn { display: grid; }
  .main-head .topic { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Сервери">
    <button class="srv on" id="srvHome" title="ДіноКорд">🦖</button>
    <hr>
    <div id="srvList" style="display:contents"></div>
    <button class="srv add" id="srvAdd" title="Створити або приєднатися">+</button>
  </nav>

  <aside class="side">
    <div class="side-head"><span id="srvName">ДіноКорд</span><span class="code" id="srvCode"></span><button class="icon-btn gear" id="btnInvite" title="Запросити друзів" hidden>🔗</button><button class="icon-btn" id="btnAdmin" title="Налаштування сервера" hidden>⚙️</button></div>
    <div class="chans" id="chans"></div>
    <div class="vbar" id="vbar" hidden>
      <div class="st"><b>Голос підключено</b><span id="vbarName">🔊 Балачка</span></div>
      <button class="icon-btn" id="btnMute" title="Вимкнути мікрофон">🎤</button>
      <button class="icon-btn hang" id="btnHang" title="Покинути дзвінок">📞</button>
    </div>
    <div id="voiceAudio" hidden></div>
    <div class="me-bar">
      <button class="ava sm" id="meAva" title="Змінити аватар"></button>
      <input id="nick" maxlength="16" aria-label="Нік">
      <button class="icon-btn" id="btnTheme" title="Тема">◐</button>
      <button class="icon-btn" id="btnLeave" title="Вийти з сервера" hidden>⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="Меню">☰</button>
      <span class="hash">#</span><span id="chanName">загальний</span>
      <span class="topic" id="chanTopic"></span>
      <span class="sp"></span>
      <button class="live-btn" id="btnScreen" hidden title="Показати свій екран">🖥️ Екран</button>
      <button class="live-btn" id="btnCam" hidden title="Транслювати камеру">📷 Камера</button>
      <button class="live-btn on" id="btnStopLive" hidden>⏹ Зупинити</button>
      <button class="live-btn" id="btnClear" hidden title="Видалити всі повідомлення в цьому каналі">🧹 Очистити</button>
    </div>
    <div class="stage" id="stage" hidden>
      <video id="stageVideo" autoplay playsinline></video>
      <div class="cap" id="stageCap"></div>
      <div class="ctl"><button id="stageFull">⛶ На весь екран</button><button id="stageClose">✕</button></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <button class="to-bottom" id="toBottom" hidden>⬇ До нових повідомлень</button>
    <div class="typing" id="typing"></div>
    <div class="composer">
      <div class="reply-bar" id="replyBar" hidden><span id="replyText"></span><button class="icon-btn" type="button" id="replyCancel" title="Скасувати відповідь">✕</button></div>
      <form id="form" autocomplete="off">
        <input id="text" maxlength="500" placeholder="Спершу створи сервер або приєднайся" disabled>
        <button class="icon-btn" type="button" id="btnPic" title="Надіслати фото">🖼</button>
        <input type="file" id="picInput" accept="image/*" hidden>
        <button class="icon-btn" type="button" id="btnRecCancel" title="Скасувати запис" hidden>✕</button>
        <button class="icon-btn" type="button" id="btnRec" title="Записати голосове повідомлення">🎙</button>
        <button class="icon-btn" type="button" id="btnRoar" title="Гаркнути">🦖</button>
      </form>
    </div>
  </main>

  <aside class="members" id="members" aria-label="Учасники"></aside>
</div>

<div class="ov" id="ovJoin">
  <div class="dlg">
    <h2>ДіноКорд</h2>
    <p>Чат для динозавриків. Створи сервер і скинь друзям код, або введи код друга.</p>
    <label for="joinCode">Код сервера</label>
    <input id="joinCode" inputmode="numeric" maxlength="6" placeholder="Наприклад, 4821">
    <div class="row">
      <button class="btn sec" id="btnJoin">Приєднатися</button>
      <button class="btn" id="btnCreate">Створити сервер</button>
    </div>
    <div class="status" id="joinStatus"></div>
    <button class="btn sec" id="btnJoinCancel" style="width:100%;margin-top:8px" hidden>Повернутися до сервера</button>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lightImg" alt=""><button id="lightClose" aria-label="Закрити">✕</button></div>

<div class="ov" id="ovAdmin" hidden>
  <div class="dlg">
    <h2 id="admTitle">Адмін</h2>
    <p id="admSub"></p>
    <div class="adm" id="admBody"></div>
    <div class="row"><button class="btn sec" id="admClose">Закрити</button></div>
  </div>
</div>

<div class="ov" id="ovAva" hidden>
  <div class="dlg">
    <h2>Профіль</h2>
    <p>Обери свого звіра і статус.</p>
    <div class="emojis" id="avaPick"></div>
    <label>Статус</label>
    <div class="st-row" id="stPick">
      <button data-st="on">🟢 В мережі</button>
      <button data-st="away">🌙 Відійшов</button>
      <button data-st="dnd">⛔ Не турбувати</button>
    </div>
    <label for="stText">Що ти зараз робиш?</label>
    <input id="stText" maxlength="40" placeholder="Наприклад: граю в Динозаврика">
    <label for="myKey">Мій ключ</label>
    <div style="display:flex;gap:6px"><input id="myKey" readonly style="font-size:11px"><button class="btn sec" id="copyKey" type="button" style="flex:none;padding:8px 12px">📋</button></div>
    <div class="row"><button class="btn" id="avaDone">Готово</button></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("dinocord-" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("dinocord-" + k, JSON.stringify(v)); } catch {} },
  };

  const CHANNELS = [
    { id: "news", name: "новини-дінокорду", topic: "Новини від автора ДіноКорду. Читай і став реакції 🦖", news: true },
    { id: "general", name: "загальний", topic: "Балачки про все" },
    { id: "games", name: "ігри", topic: "Рекорди в Динозаврику, кличте на перегони" },
    { id: "own", name: "канал-власника", topic: "Тут пише тільки творець сервера 👑", own: true },
    { id: "memes", name: "мемчики", topic: "Тільки смішне" },
    { id: "help", name: "допомога", topic: "Питання та відповіді" },
  ];
  const AVAS = ["🦖", "🦕", "🐊", "🐢", "🦎", "🐉", "🐲", "🥚", "🐸", "🦤", "🐍", "🦩"];
  const COLORS = ["#f47b67", "#ffbf3a", "#4fd27a", "#5ec8f2", "#a98bff", "#f28bd2", "#f2a35e", "#7ce0c3"];
  const REACTS = ["👍", "😂", "🔥", "🦖", "❤️"];
  const PREFIX = "dinocord-";
  const MAX_HIST = 200;

  const clean = (v, n) => String(v ?? "").replace(/[\u0000-\u001f]/g, "").trim().slice(0, n);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let me = {
    nick: store.get("nick", "Динозаврик " + (10 + Math.floor(Math.random() * 90))),
    ava: store.get("ava", pick(AVAS)),
    color: store.get("color", pick(COLORS)),
    st: ["on", "away", "dnd"].includes(store.get("st", "on")) ? store.get("st", "on") : "on",
    stx: store.get("stx", ""),
  };
  let autoAway = false;
  const myStatus = () => me.st === "on" && autoAway ? "away" : me.st;
  store.set("nick", me.nick); store.set("ava", me.ava); store.set("color", me.color);

  let net = null, myId = "me", code = "", isHost = false, chan = "general";
  const history = {};          // chan -> [msg]
  const members = new Map();   // id -> {nick, ava, color, host}
  const unread = {};
  const typing = new Map();    // id -> {chan, until}
  const voice = new Map();     // id -> {muted} for everyone in the voice channel
  const calls = new Map();     // peer id -> PeerJS media call (mesh: each pair talks directly)
  let peerObj = null, localStream = null, muted = false;
  const talking = new Set();
  const live = new Map();      // id -> {kind} for everyone streaming their screen or camera
  const viewers = new Map();   // viewer id -> call carrying my stream
  let myLive = null, watching = null, watchCall = null;
  CHANNELS.forEach(c => { history[c.id] = []; unread[c.id] = 0; });

  // ---------- render ----------
  function renderChans() {
    const box = $("chans");
    box.innerHTML = '<div class="cat">Текстові канали</div>';
    for (const c of CHANNELS) {
      const b = document.createElement("button");
      b.className = "chan" + (c.id === chan ? " on" : "");
      b.innerHTML = '<span class="hash' + (c.news ? ' ic">📣' : c.own ? ' ic">📢' : '">#') + '</span><span></span>' + (unread[c.id] ? '<span class="unread">' + Math.min(99, unread[c.id]) + "</span>" : "");
      b.children[1].textContent = c.name;
      b.onclick = () => { chan = c.id; unread[c.id] = 0; $("app").classList.remove("drawer"); renderAll(); $("text").focus(); };
      box.append(b);
    }
    const vc = document.createElement("div"); vc.className = "cat"; vc.textContent = "Голосові канали"; box.append(vc);
    const vb = document.createElement("button");
    vb.className = "vchan" + (localStream ? " on" : "");
    vb.innerHTML = '<span class="hash">🔊</span><span>Балачка</span>';
    vb.title = localStream ? "Ти в дзвінку" : "Приєднатися до дзвінка";
    vb.onclick = () => { if (!localStream) joinVoice(); };
    box.append(vb);
    const lives = [...live.entries()].filter(([id]) => members.has(id));
    if (lives.length) {
      const lc = document.createElement("div"); lc.className = "cat"; lc.textContent = "Трансляції"; box.append(lc);
      for (const [id, l] of lives) {
        const u = members.get(id);
        const b = document.createElement("button"); b.className = "lv";
        const nm = document.createElement("span"); nm.className = "nm";
        nm.textContent = (id === myId ? "Ти" : u.nick) + (l.kind === "cam" ? " · камера" : " · екран");
        const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = id === watching ? "ДИВИШСЯ" : "НАЖИВО";
        b.append(avaEl(u, "sm"), nm, tag);
        b.title = id === myId ? "Твоя трансляція" : "Дивитися";
        b.onclick = () => { $("app").classList.remove("drawer"); if (id === myId) showStage(myLive, "Твоя трансляція", true); else watch(id); };
        box.append(b);
      }
    }
    if (voice.size) {
      const vl = document.createElement("div"); vl.className = "vlist";
      for (const [id, v] of voice) {
        const u = members.get(id); if (!u) continue;
        const r = document.createElement("div"); r.className = "vuser" + (talking.has(id) && !v.muted ? " talk" : "");
        const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = u.nick;
        const mic = document.createElement("span"); mic.className = "mic"; mic.textContent = v.muted ? "🔇" : "";
        r.append(avaEl(u), nm, mic); vl.append(r);
      }
      box.append(vl);
    }
    const c = CHANNELS.find(c => c.id === chan);
    $("chanName").textContent = c.name; $("chanTopic").textContent = c.topic;
    const ownLock = (!!c.own && !iOwn()) || (!!c.news && !iSite()), mute = myPub && isMuted(myPub) ? adm.mutes.get(myPub).until : 0;
    if (net) {
      $("text").disabled = $("btnRoar").disabled = $("btnRec").disabled = $("btnPic").disabled = ownLock || !!mute;
      $("btnPic").hidden = !!c.own || !!c.news;
      $("btnRec").hidden = !!c.own || !!c.news || !window.MediaRecorder || !navigator.mediaDevices?.getUserMedia;
      $("text").placeholder = mute ? "Тобі заборонили писати до " + fmtTime(mute) : ownLock ? (c.news ? "Тут пише тільки автор ДіноКорду 📣" : "Тут пише тільки творець сервера 👑") : "Написати в #" + c.name;
    }
  }

  function avaEl(u, cls = "") {
    const a = document.createElement("div");
    a.className = "ava " + cls;
    a.style.background = u.color || "#888";
    a.textContent = u.ava || "🦖";
    return a;
  }

  const fmtTime = t => new Date(t).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });

  function textNodes(el, text) {
    // links become clickable, @mentions of my nick are highlighted, everything else is plain text
    const re = /(https?:\/\/[^\s<>"]+)|(@[^\s@]+(?:\s[^\s@]+)?)/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m[1]) {
        const url = m[1].replace(/[.,!?)»]+$/, "");
        el.append(text.slice(last, m.index));
        const a = document.createElement("a"); a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener noreferrer"; el.append(a);
        last = m.index + url.length; re.lastIndex = last;
        continue;
      }
      const tag = m[0].slice(1);
      const hit = me.nick.toLowerCase().startsWith(tag.toLowerCase()) && tag.length >= 2;
      if (!hit) continue;
      el.append(text.slice(last, m.index));
      const s = document.createElement("span"); s.className = "ping"; s.textContent = m[0]; el.append(s);
      last = m.index + m[0].length;
    }
    el.append(text.slice(last));
  }

  function renderMsgs() {
    const box = $("msgs");
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = "";
    const c = CHANNELS.find(c => c.id === chan);
    const w = document.createElement("div"); w.className = "welcome";
    w.innerHTML = '<div class="big">#</div><h2></h2><p></p>';
    w.querySelector("h2").textContent = "Ласкаво просимо в #" + c.name + "!";
    w.querySelector("p").textContent = net ? "Це початок каналу #" + c.name + ". " + c.topic + "." : "Створи сервер або приєднайся за кодом, щоб почати спілкування.";
    box.append(w);
    let prev = null;
    for (const m of history[chan]) {
      const cont = prev && !m.sys && !prev.sys && prev.from === m.from && m.t - prev.t < 5 * 60e3;
      const row = document.createElement("div");
      row.className = "msg" + (cont && !m.reply ? " cont" : "") + (m.sys ? " sys" : "");
      row.dataset.id = m.id;
      row.append(avaEl(m.sys ? { ava: "📢", color: "var(--sel)" } : m));
      const body = document.createElement("div"); body.className = "body";
      if (m.reply) {
        const q = document.createElement("button"); q.className = "quote"; q.title = "Перейти до повідомлення";
        const qn = document.createElement("b"); qn.textContent = "@" + m.reply.nick;
        const qt = document.createElement("span"); qt.textContent = m.reply.text;
        q.append(qn, qt); q.onclick = () => jumpTo(m.reply.id);
        body.append(q);
      }
      if (!cont || m.reply) {
        const h = document.createElement("div");
        const who = document.createElement("span"); who.className = "who"; who.style.color = m.sys ? "var(--muted)" : m.color; who.textContent = m.sys ? "ДіноБот" : m.nick;
        const tm = document.createElement("span"); tm.className = "time"; tm.textContent = fmtTime(m.t);
        h.append(who);
        const bg = m.sys ? "" : badgeFor(m.pub);
        if (bg) { const sp = document.createElement("span"); sp.className = "badge"; sp.textContent = bg; h.append(sp); }
        h.append(tm); body.append(h);
      }
      if (m.image) {
        const bt = document.createElement("button"); bt.className = "img-msg"; bt.title = "Відкрити фото";
        const im = document.createElement("img"); im.src = m.image; im.alt = "Фото від " + m.nick; im.loading = "lazy";
        if (m.iw && m.ih) { im.width = m.iw; im.height = m.ih; }
        bt.append(im); bt.onclick = () => { $("lightImg").src = m.image; $("lightbox").hidden = false; };
        body.append(bt);
      } else if (m.imageGone) {
        const g = document.createElement("div"); g.className = "text gone"; g.textContent = "🖼 Фото (вже недоступне)"; body.append(g);
      } else if (m.audio) {
        const vm = document.createElement("div"); vm.className = "voice-msg";
        const au = document.createElement("audio"); au.controls = true; au.preload = "metadata"; au.src = m.audio;
        vm.append(au); body.append(vm);
      } else if (m.audioGone) {
        const g = document.createElement("div"); g.className = "text gone"; g.textContent = "🎤 Голосове повідомлення (вже недоступне)"; body.append(g);
      } else { const tx = document.createElement("div"); tx.className = "text"; textNodes(tx, m.text); body.append(tx); }
      const rs = Object.entries(m.reacts || {}).filter(([, ids]) => ids.length);
      if (rs.length) {
        const rb = document.createElement("div"); rb.className = "reacts";
        for (const [e, ids] of rs) {
          const b = document.createElement("button");
          b.className = "react" + (ids.includes(myId) ? " mine" : "");
          b.textContent = e + " " + ids.length;
          b.onclick = () => toggleReact(m, e);
          rb.append(b);
        }
        body.append(rb);
      }
      row.append(body);
      if (!m.sys && net) {
        const tools = document.createElement("div"); tools.className = "tools";
        if (!$("text").disabled) {
          const rb = document.createElement("button"); rb.textContent = "↩"; rb.title = "Відповісти";
          rb.onclick = () => startReply(m); tools.append(rb);
        }
        for (const e of REACTS) {
          const b = document.createElement("button"); b.textContent = e; b.title = "Реакція";
          b.onclick = () => toggleReact(m, e);
          tools.append(b);
        }
        if (m.chan !== NEWS && (iOwn() || (iMod() && m.pub !== meta.owner))) {
          const d = document.createElement("button"); d.textContent = "🗑"; d.title = "Видалити повідомлення";
          d.onclick = () => { if (confirm("Видалити це повідомлення для всіх?")) doAdmin({ a: "del", id: m.id, chan: m.chan }); };
          tools.append(d);
        }
        row.append(tools);
      }
      box.append(row);
      prev = m;
    }
    if (atBottom || box.dataset.chan !== chan) box.scrollTop = box.scrollHeight;
    else if (box.dataset.chan === chan) $("toBottom").hidden = false;
    box.dataset.chan = chan;
  }

  function renderMembers() {
    const box = $("members");
    const list = [...members.entries()];
    box.innerHTML = '<div class="cat">В мережі: ' + list.length + "</div>";
    list.sort((a, b) => (b[1].host - a[1].host) || a[1].nick.localeCompare(b[1].nick, "uk"));
    for (const [id, u] of list) {
      const r = document.createElement("div"); r.className = "member";
      const a = avaEl(u, "sm"); const d = document.createElement("span"); d.className = "dot " + (u.st || "on"); a.append(d);
      const n = document.createElement("div"); n.style.minWidth = "0";
      const nm = document.createElement("div"); nm.className = "nm"; nm.style.color = u.color; nm.textContent = u.nick + (id === myId ? " (ти)" : "");
      n.append(nm);
      if (u.stx || u.st !== "on") { const sb = document.createElement("div"); sb.className = "sub"; sb.textContent = u.stx || (u.st === "dnd" ? "Не турбувати" : "Відійшов"); n.append(sb); }
      const tags = [];
      if (u.pub && u.pub === meta.owner) tags.push("👑 адмін");
      const rl = u.pub && adm.roles.get(u.pub)?.role;
      if (rl === "mod") tags.push("🛡️ модератор"); else if (rl === "vip") tags.push("⭐ VIP");
      if (u.host) tags.push("🖥️ тримає сервер");
      if (u.pub && isMuted(u.pub)) tags.push("🔇 заглушений");
      if (tags.length) { const t = document.createElement("div"); t.className = "tag"; t.textContent = tags.join(" · "); n.append(t); }
      if (canManage(u) && id !== myId) { r.classList.add("can"); r.title = "Керувати учасником"; r.onclick = () => memberMenu(id); }
      r.append(a, n); box.append(r);
    }
  }

  function renderTyping() {
    const now = Date.now();
    const names = [...typing.entries()].filter(([id, t]) => t.chan === chan && t.until > now && id !== myId).map(([id]) => members.get(id)?.nick).filter(Boolean);
    $("typing").textContent = names.length === 0 ? "" : names.length === 1 ? names[0] + " друкує…" : names.length < 4 ? names.join(", ") + " друкують…" : "Кілька динозавриків друкують…";
  }

  function renderMe() {
    const a = $("meAva"); a.textContent = me.ava; a.style.background = me.color;
    const d = document.createElement("span"); d.className = "dot " + myStatus(); a.append(d);
    $("nick").value = me.nick;
  }

  // every server you've been on stays in the rail; one tap switches to it
  const savedServers = () => { const v = store.get("servers", []); return Array.isArray(v) ? v.filter(x => x && /^\d{4,6}$/.test(x.code)).slice(0, 30) : []; };
  function rememberServer(c, name) {
    const list = savedServers(), i = list.findIndex(x => x.code === c);
    if (i < 0) list.push({ code: c, name: name || "" });
    else if (name && list[i].name !== name) list[i].name = name;
    else return;
    store.set("servers", list);
  }
  function forgetServer(c) { store.set("servers", savedServers().filter(x => x.code !== c)); }
  const initials = (name, c) => {
    const w = String(name || "").trim().split(/\s+/).filter(Boolean);
    return w.length ? (w.length > 1 ? w[0][0] + w[1][0] : [...w[0]].slice(0, 2).join("")).toUpperCase() : c;
  };
  let switching = false;
  async function switchServer(c) {
    if (switching || c === code) return;
    switching = true;
    if (net) leave();
    $("joinCode").value = c;
    await enter(false, true);
    switching = false;
    renderRail();
  }

  function renderRail() {
    const list = $("srvList"); list.innerHTML = "";
    if (code && net) rememberServer(code, adm.name);
    for (const sv of savedServers()) {
      const b = document.createElement("button");
      b.className = "srv" + (sv.code === code ? " on" : "") + (switching && sv.code === $("joinCode").value ? " busy" : "");
      b.title = (sv.name || "Сервер " + sv.code) + " (#" + sv.code + ")";
      b.textContent = initials(sv.name, sv.code);
      if (!sv.name) b.classList.add("num");
      b.onclick = () => switchServer(sv.code);
      list.append(b);
    }
    $("srvHome").classList.toggle("on", !code);
    $("srvName").textContent = code ? (adm.name || "Сервер " + code) : "ДіноКорд";
    $("btnAdmin").hidden = !net || !iOwn();
    $("btnInvite").hidden = !net;
    $("btnClear").hidden = !net || !iOwn();
    $("srvCode").textContent = code && adm.name ? "#" + code : "";
    $("btnLeave").hidden = !net;
  }

  function renderAll() { renderChans(); renderMsgs(); renderMembers(); renderTyping(); renderRail(); }

  // ---------- state changes (same on every peer; host relays) ----------
  function addMsg(m, verified) {
    if (!m || !history[m.chan] || typeof m.id !== "string") return;
    if ((m.chan === OWN || m.chan === NEWS) && !verified) return;
    if (m.chan !== NEWS && (adm.deleted.has(m.id) || Number(m.t) <= (adm.cleared[m.chan] || 0))) return;
    if (history[m.chan].some(x => x.id === m.id)) return;
    const msg = { id: m.id.slice(0, 40), chan: m.chan, from: String(m.from || ""), nick: clean(m.nick, 16) || "Динозаврик",
      ava: clean(m.ava, 4) || "🦖", color: /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : "#888",
      text: clean(m.text, 500), t: Number(m.t) || Date.now(), sys: !!m.sys, reacts: sanitizeReacts(m.reacts) };
    if (typeof m.sig === "string") msg.sig = m.sig.slice(0, 200);
    if (validPub(m.pub)) msg.pub = m.pub;
    if (m.reply && typeof m.reply.id === "string") msg.reply = { id: m.reply.id.slice(0, 40), nick: clean(m.reply.nick, 16) || "Динозаврик", text: clean(m.reply.text, 80) };
    if (typeof m.audio === "string" && /^data:audio\/[\w.+-]+(;[\w=.+-]+)*;base64,[A-Za-z0-9+/=]+$/.test(m.audio) && m.audio.length <= MAX_AUDIO) { msg.audio = m.audio; msg.dur = Math.min(120, Number(m.dur) || 0); }
    else if (m.audioGone) msg.audioGone = true;
    if (typeof m.image === "string" && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(m.image) && m.image.length <= MAX_MEDIA) {
      msg.image = m.image; msg.iw = Math.min(4000, Number(m.iw) || 0); msg.ih = Math.min(4000, Number(m.ih) || 0);
    } else if (m.imageGone) msg.imageGone = true;
    if (!msg.text) return;
    history[m.chan].push(msg);
    if (history[m.chan].length > 1 && history[m.chan].at(-2).t > msg.t) history[m.chan].sort((a, b) => a.t - b.t);
    if (history[m.chan].length > MAX_HIST) history[m.chan].shift();
    if (msg.audio || msg.image) pruneAudio();
    saveHist();
    typing.delete(msg.from);
    if (m.chan !== chan) unread[m.chan]++;
    else if (document.hidden && myStatus() !== "dnd") document.title = "(•) ДіноКорд";
    renderChans(); renderMsgs(); renderTyping();
  }

  function applyReact(r) {
    const m = history[r.chan]?.find(x => x.id === r.msg);
    if (!m || !REACTS.includes(r.e)) return;
    const ids = m.reacts[r.e] || (m.reacts[r.e] = []);
    const i = ids.indexOf(r.who);
    if (r.on && i < 0) ids.push(r.who);
    if (!r.on && i >= 0) ids.splice(i, 1);
    saveHist();
    if (r.chan === NEWS) saveNews();
    if (r.chan === chan) renderMsgs();
  }

  // ---------- owner channel: the server's creator signs every post with a key only their browser has ----------
  const OWN = "own";
  let myKeys = null, myPub = "", meta = {}, ownerKeyCache = null;
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
  const ALG = { name: "ECDSA", namedCurve: "P-256" }, SIG = { name: "ECDSA", hash: "SHA-256" };
  const signed = m => new TextEncoder().encode([m.id, m.chan, m.t, clean(m.text, 500), clean(m.nick, 16)].join("\u0001"));
  const iOwn = () => !!myPub && meta.owner === myPub;

  async function loadKeys() {
    if (!window.crypto?.subtle) return;
    try {
      const saved = store.get("key", null);
      if (saved?.priv && saved?.pub) {
        myKeys = { privateKey: await crypto.subtle.importKey("jwk", saved.priv, ALG, false, ["sign"]) };
        myPub = saved.pub.x + "." + saved.pub.y;
      } else {
        const k = await crypto.subtle.generateKey(ALG, true, ["sign", "verify"]);
        const priv = await crypto.subtle.exportKey("jwk", k.privateKey), pub = await crypto.subtle.exportKey("jwk", k.publicKey);
        store.set("key", { priv, pub });
        myKeys = k; myPub = pub.x + "." + pub.y;
      }
    } catch { myKeys = null; myPub = ""; }
  }

  async function ownerKey() {
    if (!meta.owner) return null;
    if (ownerKeyCache?.id === meta.owner) return ownerKeyCache.key;
    const [x, y] = meta.owner.split(".");
    const key = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x, y, ext: true }, ALG, false, ["verify"]);
    ownerKeyCache = { id: meta.owner, key };
    return key;
  }

  // ---------- DinoCord news: one channel on every server, only the site's author posts there ----------
  // Public keys of the author (the "Мій ключ" value from their profile). Only a public key goes here, never a secret.
  const SITE_KEYS = ["PhV8FacVp4BSS2IEE-ScKGoX01LvRgQQDq73zzX7Q5c.PR0Nkf-YMehOrnw-_4JSLXpRjus41nrLcZJ5BiE-OZ4"];
  const NEWS = "news";
  const iSite = () => !!myPub && SITE_KEYS.includes(myPub);
  function saveNews() {
    // news follow you from server to server, so they live outside any one server's history
    try { localStorage.setItem("dinocord-news", JSON.stringify(history[NEWS].slice(-100))); } catch {}
  }
  async function verifyNews(m) {
    for (const k of SITE_KEYS) {
      try { if (await crypto.subtle.verify(SIG, await pubKey(k), unb64(m.sig), signed(m))) return true; } catch {}
    }
    return false;
  }

  async function addChecked(m) {
    if (m?.chan === NEWS) {
      if (typeof m.sig === "string" && await verifyNews(m)) { addMsg(m, true); saveNews(); }
      return;
    }
    if (!m || m.chan !== OWN) { addMsg(m); return; }
    try {
      const key = await ownerKey();
      if (key && typeof m.sig === "string" && await crypto.subtle.verify(SIG, key, unb64(m.sig), signed(m))) addMsg(m, true);
    } catch {}
  }

  const validPub = v => typeof v === "string" && /^[\w-]{20,60}\.[\w-]{20,60}$/.test(v);

  function setMeta(next) {
    // the first owner a server ever had stays its owner
    if (!meta.owner && validPub(next?.owner)) meta = { owner: next.owner, acts: meta.acts || [] };
    if (code) store.set("meta-" + code, meta);
    if (Array.isArray(next?.acts)) addActs(next.acts);
    renderChans(); renderRail();
  }

  // ---------- admin: every action is signed by the owner's key and replayed by everyone ----------
  let acts = [];
  const seenSigs = new Set();
  const adm = { name: "", bans: new Map(), mutes: new Map(), deleted: new Set(), cleared: {}, roles: new Map() };
  const isMuted = pub => (adm.mutes.get(pub)?.until || 0) > Date.now();
  const isBanned = pub => !!pub && adm.bans.has(pub);
  const ADM_ACTS = ["rename", "ban", "unban", "mute", "unmute", "kick", "del", "clear", "role"];
  const MOD_ACTS = ["del", "mute", "unmute", "kick"];   // what a moderator may do; the rest is the creator's
  const iMod = () => !!myPub && adm.roles.get(myPub)?.role === "mod";
  const isStaff = pub => !!pub && (pub === meta.owner || adm.roles.get(pub)?.role === "mod");
  const canManage = u => iOwn() || (iMod() && !isStaff(u.pub));
  const badgeFor = pub => !pub ? "" : pub === meta.owner ? "👑" : adm.roles.get(pub)?.role === "mod" ? "🛡️" : adm.roles.get(pub)?.role === "vip" ? "⭐" : "";
  const keyCache = new Map();
  async function pubKey(pub) {
    if (!keyCache.has(pub)) {
      const [x, y] = pub.split(".");
      keyCache.set(pub, await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x, y, ext: true }, ALG, false, ["verify"]));
    }
    return keyCache.get(pub);
  }

  function resetAdmin() {
    acts = []; seenSigs.clear();
    adm.name = ""; adm.bans.clear(); adm.mutes.clear(); adm.deleted.clear(); adm.cleared = {}; adm.roles.clear();
  }

  async function addActs(list) {
    const fresh = [];
    if (!meta.owner) return fresh;
    for (const a of list.slice(-300)) {
      if (!a || typeof a.p !== "string" || typeof a.s !== "string" || a.p.length > 600 || seenSigs.has(a.s)) continue;
      const by = validPub(a.by) ? a.by : meta.owner;
      let d;
      try {
        if (!await crypto.subtle.verify(SIG, await pubKey(by), unb64(a.s), new TextEncoder().encode(a.p))) continue;
        d = JSON.parse(a.p);
      } catch { continue; }
      if (!d || !ADM_ACTS.includes(d.a) || !Number.isFinite(d.ts)) continue;
      seenSigs.add(a.s);
      const rec = { p: a.p, s: a.s, d, by: by === meta.owner ? undefined : by };
      acts.push(rec); fresh.push(rec);
    }
    if (fresh.length) applyAdmin();
    return fresh.filter(r => r.ok).map(r => r.d);
  }

  function applyAdmin() {
    acts.sort((x, y) => x.d.ts - y.d.ts);
    if (acts.length > 300) acts.splice(0, acts.length - 300);
    adm.name = ""; adm.bans.clear(); adm.mutes.clear(); adm.deleted.clear(); adm.cleared = {};
    adm.roles.clear();
    for (const rec of acts) {
      const d = rec.d;
      // replay in time order: a moderator's action counts only if they were a moderator then, and never against staff
      rec.ok = !rec.by || (adm.roles.get(rec.by)?.role === "mod" && MOD_ACTS.includes(d.a)
        && !(d.pub && (d.pub === meta.owner || adm.roles.get(d.pub)?.role === "mod")));
      if (!rec.ok) continue;
      if (d.a === "role" && validPub(d.pub)) { if (d.role === "mod" || d.role === "vip") adm.roles.set(d.pub, { role: d.role, nick: clean(d.nick, 16) }); else adm.roles.delete(d.pub); }
      else if (d.a === "rename") adm.name = clean(d.name, 24);
      else if (d.a === "ban" && validPub(d.pub)) { adm.bans.set(d.pub, clean(d.nick, 16)); adm.mutes.delete(d.pub); }
      else if (d.a === "unban") adm.bans.delete(d.pub);
      else if (d.a === "mute" && validPub(d.pub)) adm.mutes.set(d.pub, { until: Number(d.until) || 0, nick: clean(d.nick, 16) });
      else if (d.a === "unmute") adm.mutes.delete(d.pub);
      else if (d.a === "del" && typeof d.id === "string") adm.deleted.add(d.id);
      else if (d.a === "clear" && history[d.chan]) adm.cleared[d.chan] = Math.max(adm.cleared[d.chan] || 0, d.ts);
    }
    for (const c of CHANNELS) {
      const cut = adm.cleared[c.id] || 0;
      if (c.id !== NEWS) history[c.id] = history[c.id].filter(m => !adm.deleted.has(m.id) && m.t > cut);
    }
    meta.acts = acts.map(({ p, s, by }) => by ? { p, s, by } : { p, s });
    if (code) store.set("meta-" + code, meta);
    saveHist();
    renderAll();
  }

  async function doAdmin(d) {
    if (!net || !myKeys || !(iOwn() || (iMod() && MOD_ACTS.includes(d.a)))) return;
    d.ts = Date.now(); d.n = Math.random().toString(36).slice(2, 8);
    const p = JSON.stringify(d);
    const s = b64(await crypto.subtle.sign(SIG, myKeys.privateKey, new TextEncoder().encode(p)));
    const act = iOwn() ? { p, s } : { p, s, by: myPub };
    const fresh = await addActs([act]);
    net?.send({ t: "admin", act });
    fresh.forEach(enforce);
  }

  function enforce(d) {
    // kicks only count while fresh; bans and mutes hold until lifted
    if (d.a !== "ban" && d.a !== "kick" && d.a !== "mute") return;
    if (d.a === "kick" && Date.now() - d.ts > 60000) return;
    const me1 = (d.pub && d.pub === myPub) || (d.a === "kick" && d.peer === myId);
    if (me1 && !iOwn() && d.a !== "mute") { store.set("lastCode", ""); leave(d.a === "ban" ? "Адмін заблокував тебе на цьому сервері." : "Тебе вигнали з сервера."); return; }
    if (isHost && d.a !== "mute") for (const c of hostConns) if ((d.pub && c.pub === d.pub) || (d.a === "kick" && c.peer === d.peer)) { c.send({ t: "kicked", ban: d.a === "ban" }); setTimeout(() => c.close(), 300); }
    renderChans(); renderMembers();
  }

  // a guest proves which key is theirs by signing their connection id
  async function helloProof(id) {
    if (!myKeys || !myPub) return null;
    return b64(await crypto.subtle.sign(SIG, myKeys.privateKey, new TextEncoder().encode("hello|" + id)));
  }
  async function checkProof(pub, proof, id) {
    if (!validPub(pub) || typeof proof !== "string") return "";
    try {
      const [x, y] = pub.split(".");
      const key = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x, y, ext: true }, ALG, false, ["verify"]);
      return await crypto.subtle.verify(SIG, key, unb64(proof), new TextEncoder().encode("hello|" + id)) ? pub : "";
    } catch { return ""; }
  }

  // ---------- admin UI ----------
  function openAdmin(title, sub, fill) {
    $("admTitle").textContent = title; $("admSub").textContent = sub;
    const body = $("admBody"); body.innerHTML = ""; fill(body);
    $("ovAdmin").hidden = false;
  }
  const admBtn = (body, text, cls, fn) => { const b = document.createElement("button"); b.className = "btn " + cls; b.textContent = text; b.onclick = () => { $("ovAdmin").hidden = true; fn(); }; body.append(b); };

  function memberMenu(id) {
    const u = members.get(id); if (!u) return;
    const pub = u.pub;
    if (!canManage(u)) return;
    openAdmin(u.nick, pub ? "Що зробити з цим учасником?" : "Цей учасник зайшов зі старої версії, тому його можна тільки вигнати.", body => {
      if (pub && iOwn()) {
        const rl = adm.roles.get(pub)?.role;
        if (rl !== "mod") admBtn(body, "🛡️ Зробити модератором", "", () => { doAdmin({ a: "role", pub, nick: u.nick, role: "mod" }); sysMsg(u.nick + " тепер модератор 🛡️"); });
        if (rl !== "vip") admBtn(body, "⭐ Дати роль VIP", "", () => { doAdmin({ a: "role", pub, nick: u.nick, role: "vip" }); sysMsg(u.nick + " тепер VIP ⭐"); });
        if (rl) admBtn(body, "Забрати роль", "sec", () => doAdmin({ a: "role", pub, nick: u.nick, role: "" }));
      }
      if (pub) {
        if (isMuted(pub)) admBtn(body, "🔊 Дозволити писати", "sec", () => doAdmin({ a: "unmute", pub }));
        else {
          admBtn(body, "🔇 Заглушити на 10 хвилин", "sec", () => doAdmin({ a: "mute", pub, nick: u.nick, until: Date.now() + 10 * 60e3 }));
          admBtn(body, "🔇 Заглушити на 1 годину", "sec", () => doAdmin({ a: "mute", pub, nick: u.nick, until: Date.now() + 60 * 60e3 }));
          admBtn(body, "🔇 Заглушити на добу", "sec", () => doAdmin({ a: "mute", pub, nick: u.nick, until: Date.now() + 24 * 3600e3 }));
        }
      }
      admBtn(body, "👢 Вигнати з сервера", "sec", () => { doAdmin({ a: "kick", pub, peer: id }); sysMsg(u.nick + " вигнаний " + (iOwn() ? "адміном." : "модератором.")); });
      if (pub && iOwn()) admBtn(body, "⛔ Заблокувати назавжди", "danger", () => { if (confirm("Заблокувати " + u.nick + "? Він не зможе повернутися на сервер.")) { doAdmin({ a: "ban", pub, nick: u.nick }); sysMsg(u.nick + " заблокований адміном."); } });
    });
  }

  function serverSettings() {
    openAdmin("Налаштування сервера", "Це бачиш тільки ти як адмін.", body => {
      const lab = document.createElement("h3"); lab.textContent = "Назва сервера"; body.append(lab);
      const row = document.createElement("div"); row.className = "adm-row";
      const inp = document.createElement("input"); inp.maxLength = 24; inp.value = adm.name || ""; inp.placeholder = "Сервер " + code; inp.style.flex = "1";
      const ok = document.createElement("button"); ok.textContent = "Зберегти";
      ok.onclick = () => { $("ovAdmin").hidden = true; doAdmin({ a: "rename", name: clean(inp.value, 24) }); };
      row.append(inp, ok); body.append(row);
      const list = (title, map, empty, undo, label) => {
        const h = document.createElement("h3"); h.textContent = title; body.append(h);
        const items = [...map.entries()].filter(([, v]) => label(v) !== null);
        if (!items.length) { const e = document.createElement("div"); e.className = "adm-row"; e.innerHTML = "<span></span>"; e.firstChild.textContent = empty; body.append(e); return; }
        for (const [pub, v] of items) {
          const r = document.createElement("div"); r.className = "adm-row";
          const sp = document.createElement("span"); sp.textContent = label(v);
          const b = document.createElement("button"); b.textContent = undo.text;
          b.onclick = () => { $("ovAdmin").hidden = true; doAdmin({ a: undo.a, pub }); };
          r.append(sp, b); body.append(r);
        }
      };
      list("Заблоковані", adm.bans, "Нікого не заблоковано", { a: "unban", text: "Розблокувати" }, nick => nick || "Без імені");
      list("Ролі", adm.roles, "Ролей ще ніхто не має", { a: "role", text: "Забрати" }, v => (v.role === "mod" ? "🛡️ " : "⭐ ") + (v.nick || "Без імені"));
      list("Заглушені", adm.mutes, "Ніхто не заглушений", { a: "unmute", text: "Дозволити" }, v => v.until > Date.now() ? (v.nick || "Без імені") + " · до " + fmtTime(v.until) : null);
    });
  }

  // ---------- history kept in every browser, so a chat survives closing the tab ----------
  let saveTimer = 0;
  function saveHist() {
    if (!code) return;
    const c = code;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => writeHist(c), 400);
  }

  function writeHist(c) {
    // photos and voice notes are big: if the browser's storage is full, drop the oldest media first and keep all text
    const media = [];
    for (const k in history) for (const m of history[k]) if (m.audio || m.image) media.push(m);
    media.sort((a, b) => a.t - b.t);
    for (let drop = 0; drop <= media.length; drop = drop ? drop * 2 : 1) {
      const gone = new Set(media.slice(0, drop));
      const out = {};
      for (const k in history) out[k] = history[k].map(m => !gone.has(m) ? m
        : m.audio ? { ...m, audio: undefined, audioGone: true } : { ...m, image: undefined, imageGone: true });
      try { localStorage.setItem("dinocord-hist-" + c, JSON.stringify(out)); return; } catch {}
      if (drop >= media.length) return;
    }
  }

  // only the newest voice notes and photos keep their data, so history stays small enough to sync and save
  const MAX_AUDIO = 700000, KEEP_AUDIO = 8, MAX_MEDIA = 700000, KEEP_IMAGES = 12;
  function pruneAudio() {
    const au = [], im = [];
    for (const k in history) for (const m of history[k]) { if (m.audio) au.push(m); if (m.image) im.push(m); }
    au.sort((a, b) => b.t - a.t); im.sort((a, b) => b.t - a.t);
    for (const m of au.slice(KEEP_AUDIO)) { delete m.audio; m.audioGone = true; }
    for (const m of im.slice(KEEP_IMAGES)) { delete m.image; m.imageGone = true; }
  }

  function mergeHist(h) {
    // add messages we don't have, union reactions, keep time order
    if (!h || typeof h !== "object") return;
    const keepUnread = { ...unread };
    for (const c of CHANNELS) {
      const arr = Array.isArray(h[c.id]) ? h[c.id].slice(-MAX_HIST) : [];
      for (const m of arr) {
        if (!m || m.chan !== c.id) continue;
        if (c.id === OWN || c.id === NEWS) {
          const have = history[c.id].find(x => x.id === m.id);
          if (!have) { addChecked(m); continue; }
          const theirs = sanitizeReacts(m.reacts);
          for (const e in theirs) have.reacts[e] = [...new Set([...(have.reacts[e] || []), ...theirs[e]])];
          continue;
        }
        addMsg(m);
        const mine = history[c.id].find(x => x.id === m.id);
        const theirs = sanitizeReacts(m.reacts);
        if (mine) for (const e in theirs) mine.reacts[e] = [...new Set([...(mine.reacts[e] || []), ...theirs[e]])];
      }
      history[c.id].sort((a, b) => a.t - b.t);
      if (history[c.id].length > MAX_HIST) history[c.id].splice(0, history[c.id].length - MAX_HIST);
    }
    Object.assign(unread, keepUnread);
    saveHist();
  }

  function setMember(id, u) {
    const was = members.has(id);
    members.set(id, { nick: clean(u.nick, 16) || "Динозаврик", ava: clean(u.ava, 4) || "🦖",
      color: /^#[0-9a-f]{6}$/i.test(u.color) ? u.color : "#888", host: !!u.host, pub: validPub(u.pub) ? u.pub : "",
      st: ["on", "away", "dnd"].includes(u.st) ? u.st : "on", stx: clean(u.stx, 40) });
    renderMembers();
    return !was;
  }

  function dropMember(id) {
    const u = members.get(id);
    if (!u) return;
    members.delete(id); typing.delete(id); dropVoice(id); dropLive(id);
    if (isHost) sysMsg(u.nick + " пішов із сервера.");
    renderMembers(); renderTyping();
  }

  let hostConns = new Set();
  let seq = 0;
  const newId = () => myId + "-" + Date.now().toString(36) + "-" + (seq++);
  function sysMsg(text) {
    const m = { id: newId(), chan: "general", from: "sys", nick: "ДіноБот", ava: "📢", color: "#888888", text, t: Date.now(), sys: true };
    addMsg(m); net?.send({ t: "msg", m });
  }

  function toggleReact(m, e) {
    if (!net) return;
    const on = !(m.reacts[e] || []).includes(myId);
    const r = { chan: m.chan, msg: m.id, e, who: myId, on };
    applyReact(r); net.send({ t: "react", r });
  }

  // ---------- network: PeerJS star, host keeps history and relays ----------
  function loadPeerJs() {
    if (window.Peer) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
      s.onload = res; s.onerror = () => rej(new Error("load"));
      document.head.append(s);
    });
  }

  function handle(msg, fromConn, conns) {
    if (!msg || typeof msg !== "object") return;
    if (msg.t === "hello" && isHost && fromConn) {
      fromConn.uid = fromConn.peer;
      checkProof(msg.pub, msg.proof, fromConn.peer).then(pub => {
        fromConn.pub = pub;
        if (isBanned(pub)) { fromConn.send({ t: "kicked", ban: true }); setTimeout(() => fromConn.close(), 300); return; }
        welcome(msg, fromConn, conns, pub);
      });
      return;
    }
    if (msg.t === "kicked" && !isHost) { store.set("lastCode", ""); leave(msg.ban ? "Адмін заблокував тебе на цьому сервері." : "Адмін вигнав тебе з сервера."); return; }
    handleRest(msg, fromConn, conns);
  }

  function welcome(msg, fromConn, conns, pub) {
      setMeta(msg.meta);
      mergeHist(msg.hist);
      const fresh = setMember(fromConn.peer, { ...(msg.u || {}), pub });
      fromConn.send({ t: "sync", meta, history, members: [...members.entries()], voice: [...voice.entries()], live: [...live.entries()] });
      relay({ t: "member", id: fromConn.peer, u: members.get(fromConn.peer) }, fromConn, conns);
      if (fresh) sysMsg(members.get(fromConn.peer).nick + " приєднався до сервера! 🦖");
  }

  function handleRest(msg, fromConn, conns) {
    if (msg.t === "sync" && !isHost) {
      setMeta(msg.meta);
      mergeHist(msg.history);
      CHANNELS.forEach(c => { unread[c.id] = 0; });
      members.clear();
      for (const [id, u] of msg.members || []) setMember(id, u);
      live.clear();
      for (const [id, l] of Array.isArray(msg.live) ? msg.live : []) if (typeof id === "string") live.set(id, { kind: l?.kind === "cam" ? "cam" : "screen" });
      voice.clear();
      for (const [id, v] of Array.isArray(msg.voice) ? msg.voice : []) if (typeof id === "string") voice.set(id, { muted: !!v?.muted });
      renderAll();
      return;
    }
    // from a guest, trust only its own connection id
    const sender = isHost && fromConn ? fromConn.peer : null;
    if (msg.t === "msg") {
      if (!msg.m || typeof msg.m !== "object") return;
      if (sender) { if (fromConn.pub && isMuted(fromConn.pub)) return; msg.m.from = sender; msg.m.pub = fromConn.pub || ""; }
      addChecked(msg.m);
    }
    else if (msg.t === "admin") {
      if (!msg.act) return;
      addActs([msg.act]).then(f => f.forEach(enforce));
    }
    else if (msg.t === "react") { if (!msg.r || typeof msg.r !== "object") return; if (sender) msg.r.who = sender; applyReact(msg.r); }
    else if (msg.t === "member") {
      const id = sender || msg.id;
      if (sender) msg.u = { ...(msg.u || {}), pub: members.get(id)?.pub || "" };
      setMember(id, msg.u || {}); msg.id = id;
    }
    else if (msg.t === "typing") { const id = sender || msg.id; msg.id = id; typing.set(id, { chan: msg.chan, until: Date.now() + 4000 }); renderTyping(); }
    else if (msg.t === "live") {
      const id = sender || msg.id; msg.id = id;
      if (typeof id !== "string" || id === myId) return;

      renderChans();
    }
    else if (msg.t === "watch") {

      const id = sender || msg.id; msg.id = id;
      if (msg.to === myId && typeof id === "string") sendStreamTo(id);
    }
    else if (msg.t === "voice") {
      const id = sender || msg.id; msg.id = id;

      if (msg.on) voice.set(id, { muted: !!msg.muted }); else dropVoice(id);
      renderChans();

      // the host said goodbye: take over at once instead of waiting for the connection to time out
      if (!isHost) { if (msg.id === PREFIX + code) migrate(); else dropMember(msg.id); }

      c.on("data", d => handle(d, hostConn ? null : c, conns));
      c.on("close", () => {

        dropMember(c.peer);
        relay({ t: "leave", id: c.peer }, null, conns);
      });
    };
    if (hostConn) { conns.add(hostConn); wire(hostConn); }
    else peer.on("connection", c => { conns.add(c); wire(c); });
    peerObj = peer;
    peer.on("call", call => {
      if (call.metadata?.kind === "live") {
        if (call.peer !== watching) { call.close(); return; }
        watchCall?.close(); watchCall = call;
        call.answer();
        call.on("stream", s => showStage(s, (members.get(call.peer)?.nick || "Хтось") + (live.get(call.peer)?.kind === "cam" ? " · камера" : " · екран"), false));
        call.on("close", () => { if (watchCall === call) closeStage(); });
        return;
      }
      // only answer while I'm in the voice channel; if we both dialled at once, the lower id's call wins
      if (!localStream || (calls.has(call.peer) && myId < call.peer)) { call.close(); return; }
      calls.get(call.peer)?.close();
      call.answer(localStream);
      wireCall(call);

      send: msg => { for (const c of conns) if (c.open) c.send(msg); },
      close: () => setTimeout(() => peer.destroy(), 150),

  }
  function renderRec() {
    const b = $("btnRec");
    b.classList.toggle("rec", !!rec);
    b.textContent = rec ? "⏹ " + fmtDur((Date.now() - recStart) / 1000) : "🎙";
    b.title = rec ? "Надіслати" : "Записати голосове повідомлення";
    $("btnRecCancel").hidden = !rec;
    $("text").hidden = !!rec; $("btnRoar").hidden = !!rec; $("btnPic").hidden = !!rec || chan === OWN || chan === NEWS;
  }
  function sendVoice(audio, dur) {
    if (!net) return;
    const data = audio.replace(/^data:([^;,]+)[^,]*,/, "data:$1;base64,");
    if (data.length > MAX_AUDIO) { sysLocal("Голосове повідомлення завелике. Спробуй коротше."); return; }
    const m = { id: newId(), chan, from: myId, nick: me.nick, ava: me.ava, color: me.color, text: "🎤 Голосове повідомлення", audio: data, dur: Math.round(dur), t: Date.now(), pub: myPub };
    addMsg(m); net.send({ t: "msg", m });
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  // ---------- photos: shrink on this device, then send as a message ----------
  async function sendImage(file) {
    if (!net || !file || !file.type.startsWith("image/") || chan === OWN || chan === NEWS || $("btnPic").disabled) return;
    let data, w = 0, h = 0;
    try {
      if (file.type === "image/gif" && file.size <= 450000) {
        // small GIFs go as they are, so they keep moving
        data = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = rej; fr.readAsDataURL(file); });
        const im = await loadImg(data); w = im.naturalWidth; h = im.naturalHeight;
      } else {
        const url = URL.createObjectURL(file);
        const im = await loadImg(url); URL.revokeObjectURL(url);
        let side = 1280, q = 0.78;
        do {
          const k = Math.min(1, side / Math.max(im.naturalWidth, im.naturalHeight));
          w = Math.max(1, Math.round(im.naturalWidth * k)); h = Math.max(1, Math.round(im.naturalHeight * k));
          const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
          const x = cv.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
          data = cv.toDataURL("image/jpeg", q);
          side = Math.round(side * 0.8); q = Math.max(0.5, q - 0.08);
        } while (data.length > MAX_MEDIA && side > 200);
      }
    } catch { sysLocal("Не вдалося відкрити це фото. Спробуй інше."); return; }
    if (data.length > MAX_MEDIA) { sysLocal("Фото завелике. Спробуй інше."); return; }
    const m = { id: newId(), chan, from: myId, nick: me.nick, ava: me.ava, color: me.color, text: "🖼 Фото", image: data, iw: w, ih: h, t: Date.now(), pub: myPub };
    addMsg(m); net.send({ t: "msg", m });
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
  const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  $("btnPic").onclick = () => $("picInput").click();
  $("picInput").onchange = () => { const f = $("picInput").files[0]; $("picInput").value = ""; sendImage(f); };
  // paste a screenshot or drop a file onto the chat
  document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/")); if (f) { e.preventDefault(); sendImage(f); } });
  $("msgs").addEventListener("dragover", e => { if (net) { e.preventDefault(); $("msgs").classList.add("drop"); } });
  $("msgs").addEventListener("dragleave", () => $("msgs").classList.remove("drop"));
  $("msgs").addEventListener("drop", e => { e.preventDefault(); $("msgs").classList.remove("drop"); sendImage([...e.dataTransfer.files].find(f => f.type.startsWith("image/"))); });
  $("lightClose").onclick = () => { $("lightbox").hidden = true; };
  $("lightbox").addEventListener("click", e => { if (e.target === $("lightbox")) $("lightbox").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("lightbox").hidden = true; });

  $("btnRec").onclick = () => { if (rec) rec.stop(); else startRec(); };
  $("btnRecCancel").onclick = () => { recCancelled = true; rec?.stop(); };

  $("btnCreate").onclick = () => enter(true);
  $("btnJoin").onclick = () => enter(false);
  $("joinCode").addEventListener("keydown", e => { if (e.key === "Enter") enter(false); });
  const openJoin = () => {
    $("btnJoinCancel").hidden = !net; setStatus("");
    if (net) $("joinCode").value = "";
    $("ovJoin").hidden = false; $("joinCode").focus();
  };
  $("srvAdd").onclick = openJoin;
  $("srvHome").onclick = openJoin;
  $("btnJoinCancel").onclick = () => { if (net) $("ovJoin").hidden = true; };
  $("btnLeave").onclick = () => { if (confirm("Вийти з сервера і прибрати його зі списку?")) { forgetServer(code); leave(); } };
  $("btnMenu").onclick = () => $("app").classList.toggle("drawer");
  $("btnAdmin").onclick = serverSettings;
  $("btnClear").onclick = () => { const c = CHANNELS.find(c => c.id === chan); if (confirm("Видалити всі повідомлення в #" + c.name + " для всіх?")) doAdmin({ a: "clear", chan }); };
  $("admClose").onclick = () => { $("ovAdmin").hidden = true; };
  setInterval(() => { if (net && myPub && adm.mutes.has(myPub)) renderChans(); }, 15000);
  $("msgs").addEventListener("click", () => $("app").classList.remove("drawer"));

  const themes = ["auto", "dark", "light"];
  let theme = store.get("theme", "auto");
  const applyTheme = () => { if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; };
  $("btnTheme").onclick = () => { theme = themes[(themes.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(); };
  applyTheme();

  document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "ДіноКорд"; });
  window.addEventListener("pagehide", () => {
    if (code) { clearTimeout(saveTimer); writeHist(code); }
    if (net) net.send({ t: "leave", id: myId });
  });
  setInterval(renderTyping, 1000);

  // iPad/iPhone: keep the app exactly the size of what's visible, so the keyboard never pushes the header off screen
  const vv = window.visualViewport;
  const fitViewport = () => {
    document.documentElement.style.setProperty("--vh", Math.round(vv ? vv.height : window.innerHeight) + "px");
    window.scrollTo(0, 0);
  };
  (vv || window).addEventListener("resize", fitViewport);
  vv?.addEventListener("scroll", fitViewport);
  fitViewport();

  $("msgs").addEventListener("scroll", () => {
    const box = $("msgs");
    if (box.scrollHeight - box.scrollTop - box.clientHeight < 60) $("toBottom").hidden = true;
  });
  $("toBottom").onclick = () => { const box = $("msgs"); box.scrollTo({ top: box.scrollHeight, behavior: "smooth" }); $("toBottom").hidden = true; };

  const hashCode = (location.hash.match(/\d{4,6}/) || [])[0];
  window.addEventListener("hashchange", () => {
    const c = (location.hash.match(/\d{4,6}/) || [])[0];
    if (!c || c === code) return;
    if (net) leave();
    $("joinCode").value = c; enter(false, true);
  });
  $("joinCode").value = hashCode || store.get("lastCode", "");
  renderMe(); renderAll();
  loadKeys().then(() => { if ($("joinCode").value.length >= 4 && (hashCode || hasHist($("joinCode").value))) enter(false, true); });
})();
</script>
</body>
