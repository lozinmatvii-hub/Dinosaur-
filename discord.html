<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ДіноКорд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: Discord-style — server rail, channel list, chat, member list. Rooms go over PeerJS (the host relays and keeps history). */
:root {
  --rail: #1e1f22; --side: #2b2d31; --chat: #313338; --input: #383a40; --hover: #35373c; --sel: #404249;
  --ink: #dbdee1; --muted: #949ba4; --head: #f2f3f5; --line: #1f2023;
  --accent: #5865f2; --accent-2: #4752c4; --ok: #23a55a; --danger: #f23f43; --dino: #ffbf3a;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --rail: #e3e5e8; --side: #f2f3f5; --chat: #ffffff; --input: #ebedef; --hover: #e8eaed; --sel: #d7dadf;
    --ink: #313338; --muted: #5c5e66; --head: #060607; --line: #e1e2e4; --dino: #c98400; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --rail: #e3e5e8; --side: #f2f3f5; --chat: #ffffff; --input: #ebedef; --hover: #e8eaed; --sel: #d7dadf;
  --ink: #313338; --muted: #5c5e66; --head: #060607; --line: #e1e2e4; --dino: #c98400; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; background: var(--chat); color: var(--ink); font: 15px/1.4 var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input { font: inherit; color: var(--ink); }

.app { display: grid; grid-template-columns: 72px 240px minmax(0, 1fr) 240px; grid-template-rows: minmax(0, 1fr); height: var(--vh, 100dvh); padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box; }

/* server rail */
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; }
.srv { width: 48px; height: 48px; border-radius: 50%; background: var(--side); display: grid; place-items: center; font: 600 16px var(--body); font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--ink); transition: border-radius .15s, background .15s; flex: none; position: relative; }
.srv:hover, .srv.on { border-radius: 16px; background: var(--accent); color: #fff; }
.srv.on::before { content: ""; position: absolute; left: -12px; width: 4px; height: 36px; border-radius: 0 4px 4px 0; background: var(--head); }
.srv.add { color: var(--ok); font-size: 26px; }
.srv.busy { opacity: .5; }
.srv.num { font-size: 13px; letter-spacing: 0; }
.rail { scrollbar-width: none; }
.srv.add:hover { background: var(--ok); color: #fff; }
.rail hr { width: 32px; border: 0; border-top: 2px solid var(--side); margin: 2px 0; }

/* channel side */
.side { background: var(--side); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.side-head { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--head); gap: 8px; }
.side-head .code { font: 600 13px var(--body); font-variant-numeric: tabular-nums; color: var(--dino); white-space: nowrap; }
.chans { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 12px 8px; }
.cat { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; letter-spacing: .02em; }
.chan { display: flex; align-items: center; gap: 6px; width: 100%; padding: 6px 8px; border-radius: 4px; color: var(--muted); text-align: left; }
.chan:hover { background: var(--hover); color: var(--ink); }
.chan.on { background: var(--sel); color: var(--head); }
.chan .hash { font-size: 20px; line-height: 1; opacity: .7; width: 22px; text-align: center; flex: none; }
.chan .hash.ic { font-size: 15px; }
.chan .unread { margin-left: auto; background: var(--danger); color: #fff; font-size: 11px; font-weight: 600; border-radius: 8px; padding: 0 6px; }
.me-bar { background: color-mix(in srgb, var(--rail) 60%, var(--side)); padding: 8px; display: flex; align-items: center; gap: 8px; }
.me-bar input { flex: 1; min-width: 0; background: var(--input); border: 0; border-radius: 4px; padding: 6px 8px; outline: none; }
.icon-btn { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-size: 18px; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }

/* avatars */
.ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 22px; position: relative; }
.ava.sm { width: 32px; height: 32px; font-size: 17px; }
.ava .dot { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ok); border: 3px solid var(--side); }
.ava .dot.away { background: #f0b232; }
.ava .dot.dnd { background: var(--danger); }
.member .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; margin-right: 4px; }
.img-msg { display: block; margin-top: 4px; padding: 0; border-radius: 8px; overflow: hidden; max-width: min(360px, 100%); background: var(--input); }
.vid-msg { display: block; margin-top: 4px; max-width: min(360px, 100%); border-radius: 8px; overflow: hidden; background: #000; }
.vid-msg video { display: block; width: 100%; max-height: 360px; background: #000; }
.vid-busy { margin-top: 4px; font-size: 13px; color: var(--muted); }
.file-msg { display: flex; align-items: center; gap: 10px; margin-top: 4px; max-width: min(380px, 100%); padding: 10px 12px; border-radius: 8px; background: var(--input); border: 1px solid var(--line); }
.file-msg .fi { font-size: 30px; flex: none; }
.file-msg .fn { flex: 1; min-width: 0; }
.file-msg .fn b { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--accent); }
.file-msg .fn span { font-size: 12px; color: var(--muted); }
.file-msg .fb { display: flex; gap: 6px; flex: none; }
.file-msg .fb button { padding: 6px 10px; border-radius: 6px; background: var(--sel); color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.file-msg .fb button:hover { background: var(--accent); color: #fff; }
.html-view { position: fixed; inset: 0; z-index: 20; background: #000c; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.html-view .hv-head { display: flex; align-items: center; gap: 8px; color: #fff; padding: 0 0 8px; }
.html-view .hv-head span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
.html-view .hv-head button { background: #fff2; color: #fff; border-radius: 6px; padding: 6px 12px; font-size: 14px; }
.call-ov { position: fixed; inset: 0; z-index: 25; background: radial-gradient(circle at 50% 30%, #2b2d6e, #0c0d1a 70%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.call-ov[hidden], .call-pill[hidden] { display: none !important; }
.call-ov video.remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.call-ov video.self { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(28vw, 180px); border-radius: 10px; background: #000; box-shadow: 0 4px 16px #0008; z-index: 2; transform: scaleX(-1); }
.call-ov .ci { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.call-ov.vid .ci { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; align-items: flex-start; text-shadow: 0 1px 4px #000; }
.call-ov.vid .ci .ava { display: none; }
.call-ov .ci .ava { width: 120px; height: 120px; font-size: 64px; }
.call-ov.ringing .ci .ava { animation: ringPulse 1.4s ease-out infinite; }
@keyframes ringPulse { 0% { box-shadow: 0 0 0 0 #4fd27a99; } 100% { box-shadow: 0 0 0 28px #4fd27a00; } }
.call-ov .cn { font-size: 26px; font-weight: 700; }
.call-ov .cs { font-size: 15px; opacity: .8; }
.call-ov .cbs { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; z-index: 3; display: flex; justify-content: center; gap: 18px; }
.call-ov .cb { width: 60px; height: 60px; border-radius: 50%; background: #ffffff26; color: #fff; font-size: 26px; display: grid; place-items: center; }
.call-ov .cb.off { background: #fff; color: #000; }
.call-ov .cb.ok { background: #23a55a; }
.call-ov .cb.end { background: #f23f43; }
.call-ov .cb.end span { display: inline-block; transform: rotate(135deg); }
.call-ov .cb[hidden] { display: none; }
.call-ov .min { position: absolute; left: 16px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 3; background: #ffffff26; color: #fff; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
.call-pill { position: fixed; z-index: 24; left: 50%; transform: translateX(-50%); top: calc(8px + env(safe-area-inset-top, 0px)); background: #23a55a; color: #fff; border-radius: 20px; padding: 8px 16px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px #0005; }
.html-view iframe { flex: 1; width: 100%; border: 0; border-radius: 8px; background: #fff; }
.img-msg img { display: block; width: 100%; height: auto; max-height: 360px; object-fit: contain; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: #000e; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.lightbox button { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; background: #0009; color: #fff; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; }
.msgs.drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
.voice-msg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.voice-msg audio { height: 36px; max-width: 100%; }
.voice-msg .len { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.gone { color: var(--muted); font-style: italic; }
#btnRec.rec { color: var(--danger); width: auto; padding: 0 8px; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.st-row { display: flex; gap: 6px; margin-top: 6px; }
.st-row button { flex: 1; padding: 8px 6px; border-radius: 6px; background: var(--input); font-size: 13px; }
.st-row button.on { outline: 2px solid var(--accent); }

/* chat */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat); position: relative; }
.main-head { flex: none; height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); color: var(--head); font-weight: 600; }
.main-head .hash { color: var(--muted); font-size: 22px; }
#chanName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.main-head .topic { color: var(--muted); font-weight: 400; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-left: 1px solid var(--sel); padding-left: 10px; margin-left: 4px; }
.main-head .sp { flex: 1; }
.live-btn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 4px; background: var(--input); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; }
.live-btn:hover { background: var(--sel); }
.live-btn.on { background: var(--danger); color: #fff; }
.live-btn[hidden] { display: none; }
@media (max-width: 1100px) { .live-btn .lbl { display: none; } .live-btn { padding: 5px 8px; } }
.stage { background: #000; position: relative; flex: none; border-bottom: 1px solid var(--line); }
.stage video { display: block; width: 100%; max-height: 52vh; background: #000; }
.stage .cap { position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; background: #000a; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 13px; max-width: calc(100% - 120px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.stage .cap::before { content: "НАЖИВО"; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; letter-spacing: .04em; }
.stage .ctl { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.stage .ctl button { background: #000a; color: #fff; border-radius: 4px; padding: 3px 8px; font-size: 13px; }
.lv { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 4px; text-align: left; color: var(--ink); min-width: 0; }
.lv:hover { background: var(--hover); }
.lv .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.lv .tag { background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; flex: none; }
.menu-btn { display: none; }
.emoji-pop { position: fixed; z-index: 15; width: min(340px, calc(100vw - 24px)); max-height: min(360px, 60vh); display: flex; flex-direction: column; background: var(--side); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px #0006; }
.emoji-tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); flex: none; }
.emoji-tabs button { flex: 1; padding: 6px 0; border-radius: 6px; font-size: 18px; }
.emoji-tabs button.on { background: var(--sel); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; padding: 6px; overflow-y: auto; }
.emoji-grid button { font-size: 22px; aspect-ratio: 1; border-radius: 6px; }
.emoji-grid button:hover, .emoji-grid button:focus-visible { background: var(--hover); }
.look-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.look-row button { padding: 8px 10px; border-radius: 8px; background: var(--input); font-size: 13px; }
.look-row button.on { outline: 2px solid var(--accent); }
.swatch { width: 38px; height: 38px; padding: 0 !important; border-radius: 50% !important; }
.bgtile { width: 64px; height: 44px; padding: 0 !important; border-radius: 8px !important; background-size: cover !important; display: grid; place-items: center; color: #fff; font-size: 11px; text-shadow: 0 1px 2px #000; }
.msgs.has-bg { background: var(--bg-tint), var(--bg-img) center / cover no-repeat fixed; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px 0 8px; }
.welcome { padding: 16px; }
.welcome .big { width: 68px; height: 68px; border-radius: 50%; background: var(--sel); display: grid; place-items: center; font-size: 38px; margin-bottom: 8px; }
.welcome h2 { margin: 0 0 4px; color: var(--head); font-size: 28px; }
.welcome p { margin: 0; color: var(--muted); }
.msg { display: flex; gap: 16px; padding: 2px 16px; margin-top: 14px; position: relative; }
.msg.cont { margin-top: 0; }
.msg.cont .ava { visibility: hidden; height: 0; }
.msg:hover { background: color-mix(in srgb, var(--rail) 18%, transparent); }
.msg .body { min-width: 0; flex: 1; }
.msg .who { font-weight: 600; margin-right: 6px; }
.msg .time { color: var(--muted); font-size: 12px; }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .edited { color: var(--muted); font-size: 11px; margin-left: 4px; white-space: nowrap; }
.edit-box { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.edit-box textarea { width: 100%; min-height: 40px; resize: vertical; background: var(--input); border: 0; border-radius: 6px; padding: 8px 10px; color: var(--ink); font: inherit; outline: none; }
.edit-box .hint { font-size: 12px; color: var(--muted); }
.edit-box .hint button { color: var(--accent); padding: 0; font-size: 12px; }
.msg.sys .text { color: var(--muted); font-style: italic; }
.msg .text .ping { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--head); border-radius: 3px; padding: 0 2px; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.react { background: var(--input); border: 1px solid transparent; border-radius: 8px; padding: 0 6px; font-size: 14px; }
.react.mine { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, var(--input)); }
.msg .more { position: absolute; right: 16px; top: -12px; display: none; width: 30px; height: 26px; border-radius: 6px; background: var(--chat); border: 1px solid var(--line); box-shadow: 0 2px 8px #0003; font-weight: 700; color: var(--muted); }
.msg:hover .more, .msg .more:focus-visible { display: block; }
@media (hover: none) { .msg:hover .more { display: none; } }
.msg { -webkit-touch-callout: none; }
.msg.held { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.menu-bg { position: fixed; inset: 0; z-index: 18; background: #0005; }
.msg-menu { position: fixed; z-index: 19; width: min(270px, calc(100vw - 24px)); background: var(--side); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 32px #0007; overflow: hidden; }
.msg-menu .rx { display: flex; justify-content: space-between; padding: 8px; gap: 2px; border-bottom: 1px solid var(--line); }
.msg-menu .rx button { font-size: 24px; width: 38px; height: 38px; border-radius: 50%; }
.msg-menu .rx button:hover, .msg-menu .rx button.on { background: var(--sel); }
.msg-menu .act { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: left; font-size: 15px; }
.msg-menu .act:hover { background: var(--hover); }
.msg-menu .act .ic { width: 22px; text-align: center; font-size: 17px; }
.msg-menu .act.danger { color: var(--danger); }
.typing { height: 22px; padding: 0 16px; font-size: 13px; color: var(--muted); }
.composer { padding: 0 16px 20px; }
.reply-bar { display: flex; align-items: center; gap: 8px; background: var(--side); border-radius: 8px 8px 0 0; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.reply-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-bar b { color: var(--ink); }
.reply-bar + form { border-top-left-radius: 0; border-top-right-radius: 0; }
.quote { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 2px; cursor: pointer; min-width: 0; padding: 0; text-align: left; max-width: 100%; }
.quote::before { content: ""; width: 18px; height: 9px; border: 2px solid var(--sel); border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; margin-top: 6px; flex: none; }
.quote b { color: var(--ink); font-weight: 600; flex: none; }
.quote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.msg.flash { animation: flash 1.6s ease; }
.pin-bar { flex: none; display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 8%, var(--bg)); text-align: left; color: var(--ink); min-width: 0; }
.pin-bar[hidden] { display: none; }
.pin-bar .pt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.pin-bar .pt b { color: var(--accent); font-size: 12px; }
.pin-bar .pt span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.msg .pinned { color: var(--muted); font-size: 11px; margin-left: 6px; }
.lvl { display: inline-block; font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 8px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.xpbar { height: 8px; border-radius: 4px; background: var(--input); overflow: hidden; margin: 6px 0 4px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: 4px; }
.top-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 6px; text-align: left; }
.top-row .rk { width: 28px; text-align: center; font-weight: 700; color: var(--muted); flex: none; }
.top-row .nm { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
.top-row .xp { font-size: 12px; color: var(--muted); white-space: nowrap; }
.top-row.me { background: var(--hover); }
.pin-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; }
.pin-row .pt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.pin-row .pt b { display: block; font-size: 12px; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 25%, transparent); } }
.msg .text a { color: var(--accent); text-decoration: underline; word-break: break-all; }
.invite { width: 100%; background: var(--input); border: 0; border-radius: 4px; padding: 10px; color: var(--ink); font: 13px var(--body); }

    set(k, v) { try { localStorage.setItem("dinocord-" + k, JSON.stringify(v)); } catch {} },

  const fmtTime = t => new Date(t).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });

  // someone wrote @ and the start of my nick
  const mentionsMe = text => (String(text).match(/@[^\s@]+/g) || []).some(m => m.length > 2 && me.nick.toLowerCase().startsWith(m.slice(1).toLowerCase()));

  function textNodes(el, text) {
    // links become clickable, @mentions of my nick are highlighted, everything else is plain text
    const re = /(https?:\/\/[^\s<>"]+)|(@[^\s@]+(?:\s[^\s@]+)?)/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m[1]) {
        const url = m[1].replace(/[.,!?)»]+$/, "");
        el.append(text.slice(last, m.index));
        const a = document.createElement("a"); a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener noreferrer"; el.append(a);
        last = m.index + url.length; re.lastIndex = last;
        continue;
      }
      const tag = m[0].slice(1);
      const hit = me.nick.toLowerCase().startsWith(tag.toLowerCase()) && tag.length >= 2;
      if (!hit) continue;
      el.append(text.slice(last, m.index));
      const s = document.createElement("span"); s.className = "ping"; s.textContent = m[0]; el.append(s);
      last = m.index + m[0].length;
    }
    el.append(text.slice(last));
  }

  function renderMsgs() {

  // every server you've been on stays in the rail; one tap switches to it
  const savedServers = () => { const v = store.get("servers", []); return Array.isArray(v) ? v.filter(x => x && /^\d{4,6}$/.test(x.code)).slice(0, 30) : []; };
  function rememberServer(c, name) {
    const list = savedServers(), i = list.findIndex(x => x.code === c);
    if (i < 0) list.push({ code: c, name: name || "" });
    else if (name && list[i].name !== name) list[i].name = name;
    else return;
    store.set("servers", list);

    return w.length ? (w.length > 1 ? w[0][0] + w[1][0] : [...w[0]].slice(0, 2).join("")).toUpperCase() : c;

  // ---------- state changes (same on every peer; host relays) ----------
  function addMsg(m, verified) {
    if (!m || !history[m.chan] || typeof m.id !== "string") return;
    if ((m.chan === OWN || m.chan === NEWS) && !verified) return;
    if (m.chan !== NEWS && (adm.deleted.has(m.id) || Number(m.t) <= (adm.cleared[m.chan] || 0))) return;
    if (history[m.chan].some(x => x.id === m.id)) return;
    const msg = { id: m.id.slice(0, 40), chan: m.chan, from: String(m.from || ""), nick: clean(m.nick, 16) || "Динозаврик",
      ava: clean(m.ava, 4) || "🦖", color: /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : "#888",

  // ---------- history kept in every browser, so a chat survives closing the tab ----------
  let saveTimer = 0;
  function saveHist() {
    if (!code) return;
    const c = code;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => writeHist(c), 400);
  }

  function writeHist(c) {
    // photos and voice notes are big: if the browser's storage is full, drop the oldest media first and keep all text
    const media = [];
    for (const k in history) for (const m of history[k]) if (m.audio || m.image) media.push(m);
    media.sort((a, b) => a.t - b.t);
    for (let drop = 0; drop <= media.length; drop = drop ? drop * 2 : 1) {
      const gone = new Set(media.slice(0, drop));
      const out = {};
      for (const k in history) out[k] = history[k].map(m => !gone.has(m) ? m
        : m.audio ? { ...m, audio: undefined, audioGone: true } : { ...m, image: undefined, imageGone: true });
      try { localStorage.setItem("dinocord-hist-" + c, JSON.stringify(out)); return; } catch {}
      if (drop >= media.length) return;
    }
  }

  // only the newest voice notes and photos keep their data, so history stays small enough to sync and save
  const MAX_AUDIO = 700000, KEEP_AUDIO = 8, MAX_MEDIA = 700000, KEEP_IMAGES = 12;
  function pruneAudio() {
    const au = [], im = [];
    for (const k in history) for (const m of history[k]) { if (m.audio) au.push(m); if (m.image) im.push(m); }
    au.sort((a, b) => b.t - a.t); im.sort((a, b) => b.t - a.t);
    for (const m of au.slice(KEEP_AUDIO)) { delete m.audio; m.audioGone = true; }
    for (const m of im.slice(KEEP_IMAGES)) { delete m.image; m.imageGone = true; }
  }

  let merging = 0;
  function mergeHist(h) {
    // add messages we don't have, union reactions, keep time order
    if (!h || typeof h !== "object") return;
    merging++;
    try { mergeHistInner(h); } finally { merging--; }
  }
  function mergeHistInner(h) {
    const keepUnread = { ...unread };
    for (const c of CHANNELS) {
      const arr = Array.isArray(h[c.id]) ? h[c.id].slice(-MAX_HIST) : [];
      for (const m of arr) {
        if (!m || m.chan !== c.id) continue;
        if (c.id === OWN || c.id === NEWS) {
          const have = history[c.id].find(x => x.id === m.id);
          if (!have) { addChecked(m); continue; }
          const theirs = sanitizeReacts(m.reacts);
          for (const e in theirs) have.reacts[e] = [...new Set([...(have.reacts[e] || []), ...theirs[e]])];
          continue;
        }
        addMsg(m);
        const mine = history[c.id].find(x => x.id === m.id);
        if (mine && Number(m.edited) > (mine.edited || 0) && clean(m.text, 500)) { mine.text = clean(m.text, 500); mine.edited = Number(m.edited); }
        if (mine && Number(m.del) > 0 && !mine.del) applyDelete({ chan: c.id, id: m.id, at: Number(m.del) });
        const theirs = sanitizeReacts(m.reacts);
        if (mine) for (const e in theirs) mine.reacts[e] = [...new Set([...(mine.reacts[e] || []), ...theirs[e]])];
      }
      history[c.id].sort((a, b) => a.t - b.t);
      if (history[c.id].length > MAX_HIST) history[c.id].splice(0, history[c.id].length - MAX_HIST);
    }
    Object.assign(unread, keepUnread);
    saveHist();
  }

  function setMember(id, u) {
    let was = members.has(id), since = members.get(id)?.since || Date.now();
    if (validPub(u.pub)) for (const [oid, ou] of [...members]) {
      if (oid === id || ou.pub !== u.pub || oid === myId) continue;
      // same person on a newer connection (woke up, reconnected): keep one row, drop the stale one quietly
      was = true; since = Math.min(since, ou.since || since);
      members.delete(oid); typing.delete(oid); dropVoice(oid); dropLive(oid);
      if (isHost) { for (const c of hostConns) if (c.peer === oid) c.close(); relay({ t: "leave", id: oid, quiet: true }, null, hostConns); }
    }
    members.set(id, { nick: clean(u.nick, 16) || "Динозаврик", ava: clean(u.ava, 4) || "🦖",
      color: /^#[0-9a-f]{6}$/i.test(u.color) ? u.color : "#888", host: !!u.host, pub: validPub(u.pub) ? u.pub : "",
      st: ["on", "away", "dnd"].includes(u.st) ? u.st : "on", stx: clean(u.stx, 40), photo: validPhoto(u.photo) ? u.photo : "",
      bio: String(u.bio ?? "").replace(/[\u0000-\u0009\u000b-\u001f]/g, "").trim().slice(0, 160), banner: /^#[0-9a-f]{6}$/i.test(u.banner) ? u.banner : "", since });
    if (validPub(u.pub)) rememberPhoto(u.pub, validPhoto(u.photo) ? u.photo : "");
    renderMembers();
    return !was;
  }

  const leftSoon = new Map();   // key -> timer for a "left" note that a quick return cancels
  function dropMember(id) {
    const u = members.get(id);
    if (!u) return;
    members.delete(id); typing.delete(id); dropVoice(id); dropLive(id);
    if (dmCall?.peer === id) endCall("Зв'язок обірвався");
    if (isHost && ![...members.values()].some(o => u.pub && o.pub === u.pub)) {
      const k = u.pub || id;
      clearTimeout(leftSoon.get(k));
      leftSoon.set(k, setTimeout(() => {
        leftSoon.delete(k);
        if (net && isHost && ![...members.values()].some(o => u.pub && o.pub === u.pub)) sysMsg(u.nick + " пішов із сервера.");
      }, 30000));
    }
    renderMembers(); renderTyping();
  }

  let hostConns = new Set();
  let seq = 0;
  const newId = () => myId + "-" + Date.now().toString(36) + "-" + (seq++);
  function sysMsg(text) {
    const m = { id: newId(), chan: "general", from: "sys", nick: "ДіноБот", ava: "📢", color: "#888888", text, t: Date.now(), sys: true };
    addMsg(m); net?.send({ t: "msg", m });
  }

  function toggleReact(m, e) {
    if (!net) return;
    const on = !(m.reacts[e] || []).includes(myId);
    const r = { chan: m.chan, msg: m.id, e, who: myId, on };
    applyReact(r); net.send({ t: "react", r });
  }

  // ---------- network: PeerJS star, host keeps history and relays ----------
  function loadPeerJs() {
    if (window.Peer) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
      s.onload = res; s.onerror = () => rej(new Error("load"));
      document.head.append(s);
    });
  }

  function handle(msg, fromConn, conns) {
    if (!msg || typeof msg !== "object") return;
    if (msg.t === "hello" && isHost && fromConn) {
      fromConn.uid = fromConn.peer;
      checkProof(msg.pub, msg.proof, fromConn.peer).then(pub => {
        fromConn.pub = pub;
        if (isBanned(pub)) { fromConn.send({ t: "kicked", ban: true }); setTimeout(() => fromConn.close(), 300); return; }
        welcome(msg, fromConn, conns, pub);
      });
      return;
    }
    if (msg.t === "kicked" && !isHost) { store.set("lastCode", ""); leave(msg.ban ? "Адмін заблокував тебе на цьому сервері." : "Адмін вигнав тебе з сервера."); return; }
    handleRest(msg, fromConn, conns);
  }

  function welcome(msg, fromConn, conns, pub) {
      setMeta(msg.meta);
      mergeHist(msg.hist);
      mergeXp(msg.xp);
      const back = pub && leftSoon.has(pub);
      if (back) { clearTimeout(leftSoon.get(pub)); leftSoon.delete(pub); }
      const fresh = setMember(fromConn.peer, { ...(msg.u || {}), pub }) && !back;
      fromConn.send({ t: "sync", meta, history, xp: xpBook, members: [...members.entries()], voice: [...voice.entries()], live: [...live.entries()] });
      relay({ t: "member", id: fromConn.peer, u: members.get(fromConn.peer) }, fromConn, conns);
      if (fresh) sysMsg(members.get(fromConn.peer).nick + " приєднався до сервера! 🦖");
  }

  function handleRest(msg, fromConn, conns) {
    if (msg.t === "sync" && !isHost) {
      setMeta(msg.meta);
      mergeHist(msg.history);
      mergeXp(msg.xp);
      CHANNELS.forEach(c => { unread[c.id] = 0; });
      members.clear();
      for (const [id, u] of msg.members || []) setMember(id, u);
      live.clear();
      for (const [id, l] of Array.isArray(msg.live) ? msg.live : []) if (typeof id === "string") live.set(id, { kind: l?.kind === "cam" ? "cam" : "screen" });
      voice.clear();
      for (const [id, v] of Array.isArray(msg.voice) ? msg.voice : []) if (typeof id === "string") voice.set(id, { muted: !!v?.muted });
      renderAll();
      return;
    }
    // from a guest, trust only its own connection id
    const sender = isHost && fromConn ? fromConn.peer : null;
    if (msg.t === "msg") {
      if (!msg.m || typeof msg.m !== "object") return;
      if (sender) { if (fromConn.pub && isMuted(fromConn.pub)) return; msg.m.from = sender; msg.m.pub = fromConn.pub || ""; }
      addChecked(msg.m);
    }
    else if (msg.t === "delown") {
      const e = msg.e; if (!e || typeof e.id !== "string") return;
      const orig = history[e.chan]?.find(x => x.id === e.id);
      if (sender && (!orig || !(orig.pub ? orig.pub === fromConn.pub : orig.from === sender))) return;
      applyDelete(e);
    }
    else if (msg.t === "edit") {
      const e = msg.e; if (!e || typeof e.id !== "string") return;
      const orig = history[e.chan]?.find(x => x.id === e.id);
      if (sender && (!orig || !(orig.pub ? orig.pub === fromConn.pub : orig.from === sender))) return;
      applyEdit(e);
    }
    else if (msg.t === "admin") {
      if (!msg.act) return;
      addActs([msg.act]).then(f => f.forEach(enforce));
    }
    else if (msg.t === "react") { if (!msg.r || typeof msg.r !== "object") return; if (sender) msg.r.who = sender; applyReact(msg.r); }
    else if (msg.t === "member") {
      const id = sender || msg.id;
      if (sender) msg.u = { ...(msg.u || {}), pub: members.get(id)?.pub || "" };
      setMember(id, msg.u || {}); msg.id = id;
    }
    else if (msg.t === "typing") { const id = sender || msg.id; msg.id = id; typing.set(id, { chan: msg.chan, until: Date.now() + 4000 }); renderTyping(); }
    else if (msg.t === "live") {
      const id = sender || msg.id; msg.id = id;
      if (typeof id !== "string" || id === myId) return;
      if (msg.on) live.set(id, { kind: msg.kind === "cam" ? "cam" : "screen" }); else dropLive(id);
      renderChans();
    }
    else if (msg.t === "watch") {
      // someone wants my stream: everyone hears it via the host, only the streamer acts
      const id = sender || msg.id; msg.id = id;
      if (msg.to === myId && typeof id === "string") sendStreamTo(id);
    }
    else if (msg.t === "voice") {
      const id = sender || msg.id; msg.id = id;
      if (typeof id !== "string" || id === myId) return;
      if (msg.on) voice.set(id, { muted: !!msg.muted }); else dropVoice(id);
      renderChans();
    }
    else if (msg.t === "leave") {
      // the host said goodbye: take over at once instead of waiting for the connection to time out
      if (!isHost) { if (msg.id === PREFIX + code) migrate(); else dropMember(msg.id); }
      return;
    }
    else return;
    if (isHost) relay(msg, fromConn, conns);
  }

  function sanitizeReacts(r) {
    const out = {};
    if (r && typeof r === "object") for (const e of Object.keys(r).slice(0, 40)) if (okReact(e) && Array.isArray(r[e])) out[e] = r[e].filter(x => typeof x === "string").slice(0, 100);
    return out;
  }

  function relay(msg, except, conns) { for (const c of conns) if (c !== except && c.open) c.send(msg); }

  function makeNet(peer, hostConn) {
    const conns = new Set();
    hostConns = hostConn ? new Set() : conns;
    const wire = c => {
      c.lastSeen = Date.now();
      c.on("data", d => { c.lastSeen = Date.now(); if (d?.t !== "ping") handle(d, hostConn ? null : c, conns); });
      c.on("close", () => {
        conns.delete(c);
        if (hostConn) { migrate(); return; }
        dropMember(c.peer);
        relay({ t: "leave", id: c.peer }, null, conns);
      });
    };
    if (hostConn) { conns.add(hostConn); wire(hostConn); }
    peer.on("connection", c => {
      // private messages come over their own direct connection; everything else only to the host
      if (c.metadata?.kind === "dm") { wireDm(c); return; }
      if (hostConn) { c.close(); return; }
      conns.add(c); wire(c);
    });
    peerObj = peer;
    peer.on("call", call => {
      if (call.metadata?.kind === "live") {
        if (call.peer !== watching) { call.close(); return; }
        watchCall?.close(); watchCall = call;
        call.answer();
        call.on("stream", s => showStage(s, (members.get(call.peer)?.nick || "Хтось") + (live.get(call.peer)?.kind === "cam" ? " · камера" : " · екран"), false));
        call.on("close", () => { if (watchCall === call) closeStage(); });
        return;
      }
      if (call.metadata?.kind === "dm-call") { onCallMedia(call); return; }
      // only answer while I'm in the voice channel; if we both dialled at once, the lower id's call wins
      if (!localStream || (calls.has(call.peer) && myId < call.peer)) { call.close(); return; }
      calls.get(call.peer)?.close();
      call.answer(localStream);
      wireCall(call);
    });
    // a tab in the background or a sleeping iPad never says goodbye: ping every 5 s, give up after 25 s of silence
    const beat = setInterval(() => {
      const now = Date.now();
      for (const c of [...conns]) {
        if (c.open) c.send({ t: "ping" });
        if (now - (c.lastSeen || now) > 25000) {
          if (hostConn) { clearInterval(beat); migrate(); return; }
          conns.delete(c); try { c.close(); } catch {}
          dropMember(c.peer); relay({ t: "leave", id: c.peer }, null, conns);
        }
      }
    }, 5000);
    return {
      send: msg => { for (const c of conns) if (c.open) c.send(msg); },
      close: () => { clearInterval(beat); setTimeout(() => peer.destroy(), 150); },
    };
  }

  async function connect(c, create) {
    await loadPeerJs();
    return new Promise((res, rej) => {
        const peer = create ? new Peer(PREFIX + c) : new Peer();
        const fail = e => { peer.destroy(); rej(e); };
        peer.on("error", fail);
        peer.on("open", id => {
          myId = id;
          if (create) { peer.off("error", fail); peer.on("error", () => {}); res(makeNet(peer, null)); return; }
          const conn = peer.connect(PREFIX + c, { reliable: true });
          const timer = setTimeout(() => fail({ type: "peer-unavailable" }), 9000);
          conn.on("open", () => {
            clearTimeout(timer); peer.off("error", fail); peer.on("error", () => {});
            const n = makeNet(peer, conn);
            helloProof(id).then(proof => { conn.send({ t: "hello", u: { ...me, st: myStatus(), photo: me.photo }, hist: history, meta, pub: myPub, proof, xp: xpBook }); res(n); });
          });
        });
      });
  }

  const hasHist = c => { const h = store.get("hist-" + c, null); return !!h && CHANNELS.some(x => Array.isArray(h[x.id]) && h[x.id].length); };

  async function enter(create, auto) {
    if (net) { if (switching) return; leave(); }
    let c = $("joinCode").value.replace(/\D/g, "").slice(0, 6);
    if (create) c = String(1000 + Math.floor(Math.random() * 9000));
    if (c.length < 4) { setStatus("Введи код сервера: щонайменше 4 цифри.", true); $("joinCode").focus(); return; }
    $("btnJoin").disabled = $("btnCreate").disabled = true;
    setStatus(auto ? "Повертаюсь на сервер " + c + "…" : "Підключаюсь…");
    // start from what this browser remembers about the server
    CHANNELS.forEach(x => { history[x.id] = []; unread[x.id] = 0; });
    meta = {}; ownerKeyCache = null; resetAdmin();
    code = c; loadXp(c); setMeta(store.get("meta-" + c, null)); mergeHist(store.get("hist-" + c, null));
    mergeHist({ [NEWS]: store.get("news", []) }); code = "";
    try {
      try { net = await connect(c, create); }
      catch (e) {
        // nobody is hosting it right now, but I have its chat: bring the server back myself
        if (create || e?.type !== "peer-unavailable" || !(hasHist(c) || savedServers().some(x => x.code === c))) throw e;
        net = await connect(c, true); create = true;

      busy.remove();
      addMsg(m); net?.send({ t: "msg", m });
      $("msgs").scrollTop = $("msgs").scrollHeight;
    } catch (e) {
      busy.remove();
      sysLocal(e?.message === "long" ? "Відео задовге. Можна до " + MAX_VIDEO_SEC + " секунд." : e?.message === "big" ? "Відео завелике навіть після стискання. Спробуй коротше." : "Не вдалося надіслати це відео. Спробуй інше.");
    }
  }
  // ---------- any other file: html games, documents, archives… kept in this browser like videos ----------
  const MAX_FILE = 6 * 1024 * 1024;
  const safeName = v => clean(String(v ?? "").replace(/[\\/:*?"<>|]/g, "_"), 80) || "файл";
  const isHtml = m => /\.html?$/i.test(m.fname) || m.ftype === "text/html";
  const fileIcon = m => isHtml(m) ? "🌐" : /\.(zip|rar|7z)$/i.test(m.fname) ? "📦" : /\.pdf$/i.test(m.fname) ? "📕" : /^audio\//.test(m.ftype) ? "🎵"
    : /\.(txt|md|json|js|css|py|csv)$/i.test(m.fname) ? "📝" : /\.(sb3|exe|apk)$/i.test(m.fname) ? "🎮" : "📄";
  const fmtSize = n => n < 1024 ? n + " Б" : n < 1048576 ? Math.round(n / 1024) + " КБ" : (n / 1048576).toFixed(1).replace(".", ",") + " МБ";
  const fEls = new Map();
  function fileEl(m) {
    if (fEls.has(m.id)) return fEls.get(m.id);
    const el = document.createElement("div"); el.className = "file-msg";
    const ic = document.createElement("span"); ic.className = "fi"; ic.textContent = fileIcon(m);
    const fn = document.createElement("div"); fn.className = "fn";
    const nm = document.createElement("b"); nm.textContent = m.fname;
    const sz = document.createElement("span"); sz.textContent = fmtSize(m.fsize);
    fn.append(nm, sz);
    const fb = document.createElement("div"); fb.className = "fb";
    el.append(ic, fn, fb);
    getVideoUrl(m.id).then(u => {
      if (!u) { sz.textContent = fmtSize(m.fsize) + " · недоступний на цьому пристрої"; return; }
      if (isHtml(m)) { const o = document.createElement("button"); o.textContent = "▶ Відкрити"; o.onclick = () => openHtml(m, u); fb.append(o); }
      const d = document.createElement("button"); d.textContent = "⬇"; d.title = "Завантажити";
      d.onclick = () => { const a = document.createElement("a"); a.href = u; a.download = m.fname; document.body.append(a); a.click(); a.remove(); };
      fb.append(d);
    });
    fEls.set(m.id, el);
    return el;
  }
  async function openHtml(m, url) {
    // runs in a sandbox with its own empty origin: the page can't touch this chat, its keys or its storage
    const html = await (await fetch(url)).text();
    const wrap = document.createElement("div"); wrap.className = "html-view";
    const head = document.createElement("div"); head.className = "hv-head";
    const t = document.createElement("span"); t.textContent = "🌐 " + m.fname + " · від " + m.nick;
    const x = document.createElement("button"); x.textContent = "✕ Закрити";
    const fr = document.createElement("iframe");
    fr.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-pointer-lock");
    fr.setAttribute("allow", "fullscreen; autoplay");
    fr.srcdoc = html;
    x.onclick = () => wrap.remove();
    head.append(t, x); wrap.append(head, fr); document.body.append(wrap);
  }
  async function sendFile(file) {
    if (!net || !file || chan === OWN || chan === NEWS || $("btnPic").disabled) return;
    if (file.size > MAX_FILE) { sysLocal("Файл завеликий (" + fmtSize(file.size) + "). Можна до " + fmtSize(MAX_FILE) + "."); return; }
    try {
      const type = /^[\w.+-]+\/[\w.+-]+$/.test(file.type) ? file.type : "application/octet-stream";
      const data = "data:" + type + ";base64," + (await toDataUrl(file)).split(",")[1];
      const m = { id: newId(), chan, from: myId, nick: me.nick, ava: me.ava, color: me.color, text: "📎 " + safeName(file.name), file: true, fname: safeName(file.name), fsize: file.size, ftype: type, fileData: data, t: Date.now(), pub: myPub };
      addMsg(m); net?.send({ t: "msg", m });
      $("msgs").scrollTop = $("msgs").scrollHeight;
    } catch { sysLocal("Не вдалося надіслати цей файл. Спробуй інший."); }
  }
  const sendAny = f => { if (!f) return; if (f.type.startsWith("video/")) sendVideo(f); else if (/^image\/(jpeg|png|webp|gif|heic|heif)$/.test(f.type)) sendImage(f); else sendFile(f); };
  $("btnPic").onclick = () => $("picInput").click();
  $("picInput").onchange = () => { const f = $("picInput").files[0]; $("picInput").value = ""; sendAny(f); };
  // paste a screenshot or drop a file onto the chat
  document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/")); if (f) { e.preventDefault(); sendImage(f); } });
  $("msgs").addEventListener("dragover", e => { if (net) { e.preventDefault(); $("msgs").classList.add("drop"); } });
  $("msgs").addEventListener("dragleave", () => $("msgs").classList.remove("drop"));
  $("msgs").addEventListener("drop", e => { e.preventDefault(); $("msgs").classList.remove("drop"); sendAny(e.dataTransfer.files[0]); });
  $("lightClose").onclick = () => { $("lightbox").hidden = true; };
  $("lightbox").addEventListener("click", e => { if (e.target === $("lightbox")) $("lightbox").hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { $("lightbox").hidden = true; $("emojiPop").hidden = true; } });

  // ---------- emoji picker: for the message box and for reactions ----------
  let emojiCb = null, emojiTab = Object.keys(EMOJI)[0];
  const recentEmoji = () => { const v = store.get("recentEmoji", []); return Array.isArray(v) ? v.filter(e => ALL_EMOJI.has(e)).slice(0, 16) : []; };
  function renderEmoji() {
    const tabs = $("emojiTabs"); tabs.innerHTML = "";
    const keys = (recentEmoji().length ? ["🕘"] : []).concat(Object.keys(EMOJI));
    if (!keys.includes(emojiTab)) emojiTab = keys[0];
    for (const k of keys) {
      const b = document.createElement("button"); b.textContent = k; b.className = k === emojiTab ? "on" : "";
      b.title = k === "🕘" ? "Нещодавні" : "";
      b.onclick = ev => { ev.stopPropagation(); emojiTab = k; renderEmoji(); };
      tabs.append(b);
    }
    const grid = $("emojiGrid"); grid.innerHTML = "";
    for (const e of emojiTab === "🕘" ? recentEmoji() : EMOJI[emojiTab].split(" ")) {
      const b = document.createElement("button"); b.textContent = e;
      b.onclick = ev => {
        ev.stopPropagation();
        store.set("recentEmoji", [e, ...recentEmoji().filter(x => x !== e)].slice(0, 16));
        const cb = emojiCb; $("emojiPop").hidden = true; cb?.(e);
      };
      grid.append(b);
    }
  }
  function openEmoji(anchor, cb) {
    emojiCb = cb; renderEmoji();
    const pop = $("emojiPop"); pop.hidden = false;
    const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(12, Math.min(innerWidth - w - 12, r.right - w)) + "px";
    pop.style.top = (r.top - h - 8 > 12 ? r.top - h - 8 : Math.min(innerHeight - h - 12, r.bottom + 8)) + "px";
  }
  document.addEventListener("click", e => { if (!$("emojiPop").hidden && !$("emojiPop").contains(e.target)) $("emojiPop").hidden = true; });
  $("btnEmoji").onclick = ev => {
    ev.stopPropagation();
    if (!$("emojiPop").hidden) { $("emojiPop").hidden = true; return; }
    openEmoji($("btnEmoji"), e => {
      const t = $("text"), a = t.selectionStart ?? t.value.length, z = t.selectionEnd ?? a;
      t.value = (t.value.slice(0, a) + e + t.value.slice(z)).slice(0, 500);
      t.focus(); t.setSelectionRange(a + e.length, a + e.length);
    });
  };

  // ---------- looks: accent colour and chat background, kept on this device ----------
  const ACCENTS = [
    ["Синій", "#5865f2", "#4752c4"], ["Зелений", "#23a55a", "#1a8048"], ["Помаранчевий", "#e67e22", "#c4661a"],
    ["Рожевий", "#e84393", "#c42f7a"], ["Фіолетовий", "#8e44ad", "#723690"], ["Червоний", "#e03e3e", "#bb2f2f"], ["Бірюзовий", "#00a8a8", "#008585"],
  ];
  const BGS = [
    ["Без фону", ""],
    ["Джунглі", "radial-gradient(circle at 20% 20%, #3f9b4c 0, transparent 45%), radial-gradient(circle at 80% 70%, #1f6b3a 0, transparent 50%), linear-gradient(160deg, #183d24, #0e2616)"],
    ["Нічне небо", "radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent), radial-gradient(1px 1px at 85% 60%, #fff, transparent), linear-gradient(180deg, #0b1033, #2a1b5c)"],
    ["Пустеля", "linear-gradient(180deg, #f6c177 0%, #e8915a 55%, #b5653a 100%)"],
    ["Вулкан", "radial-gradient(circle at 50% 110%, #ff6a00 0, #a3220f 35%, transparent 60%), linear-gradient(180deg, #2a0f0f, #1a0606)"],
    ["Океан", "linear-gradient(180deg, #4fc3f7 0%, #0277bd 60%, #01386b 100%)"],
  ];
  let look = Object.assign({ accent: 0, bg: 0, photo: "" }, store.get("look", {}));
  function applyLook() {
    const ac = ACCENTS[look.accent] || ACCENTS[0], root = document.documentElement.style;
    root.setProperty("--accent", ac[1]); root.setProperty("--accent-2", ac[2]);
    const img = look.bg === -1 && look.photo ? 'url("' + look.photo + '")' : (BGS[look.bg] || BGS[0])[1];
    const msgs = $("msgs");
    msgs.classList.toggle("has-bg", !!img);
    if (img) {
      msgs.style.setProperty("--bg-img", img);
      msgs.style.setProperty("--bg-tint", "linear-gradient(color-mix(in srgb, var(--chat) 55%, transparent), color-mix(in srgb, var(--chat) 55%, transparent))");
    }
  }
  function renderLook() {
    const th = $("lookTheme"); th.innerHTML = "";
    for (const [k, label] of [["auto", "🌓 Як на пристрої"], ["dark", "🌙 Темна"], ["light", "☀️ Світла"]]) {
      const b = document.createElement("button"); b.textContent = label; b.className = theme === k ? "on" : "";
      b.onclick = () => { theme = k; store.set("theme", theme); applyTheme(); renderLook(); };
      th.append(b);
    }
    const ac = $("lookAccent"); ac.innerHTML = "";
    ACCENTS.forEach(([name, c], i) => {
      const b = document.createElement("button"); b.className = "swatch" + (look.accent === i ? " on" : ""); b.title = name; b.setAttribute("aria-label", name);
      b.style.background = c; b.onclick = () => { look.accent = i; store.set("look", look); applyLook(); renderLook(); };
      ac.append(b);
    });
    const bg = $("lookBg"); bg.innerHTML = "";
    BGS.forEach(([name, css], i) => {
      const b = document.createElement("button"); b.className = "bgtile" + (look.bg === i ? " on" : ""); b.textContent = name;
      b.style.background = css || "var(--chat)"; if (!css) b.style.color = "var(--ink)";
      b.onclick = () => { look.bg = i; store.set("look", look); applyLook(); renderLook(); };
      bg.append(b);
    });
    const ph = document.createElement("button"); ph.className = "bgtile" + (look.bg === -1 ? " on" : ""); ph.textContent = "📷 Своє фото";
    ph.style.background = look.photo ? 'url("' + look.photo + '") center / cover' : "var(--sel)";
    ph.onclick = () => $("bgInput").click();
    bg.append(ph);
  }
  $("bgInput").onchange = async () => {
    const f = $("bgInput").files[0]; $("bgInput").value = "";
    if (!f) return;
    try {
      const url = URL.createObjectURL(f), im = await loadImg(url); URL.revokeObjectURL(url);
      const k = Math.min(1, 1400 / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      look.photo = cv.toDataURL("image/jpeg", 0.7); look.bg = -1;
      store.set("look", look); applyLook(); renderLook();
    } catch {}
  };
  $("lookDone").onclick = () => { $("ovLook").hidden = true; };
  $("ovLook").addEventListener("click", e => { if (e.target === $("ovLook")) $("ovLook").hidden = true; });

  $("btnRec").onclick = () => { if (rec) rec.stop(); else startRec(); };
  $("btnRecCancel").onclick = () => { recCancelled = true; rec?.stop(); };

  $("btnCreate").onclick = () => enter(true);
  $("btnJoin").onclick = () => enter(false);
  $("joinCode").addEventListener("keydown", e => { if (e.key === "Enter") enter(false); });
  const openJoin = () => {
    $("btnJoinCancel").hidden = !net; setStatus("");
    if (net) $("joinCode").value = "";
    renderJoinSaved();
    $("ovJoin").hidden = false; $("joinCode").focus();
  };
  $("srvAdd").onclick = openJoin;
  $("srvHome").onclick = openJoin;
  $("btnJoinCancel").onclick = () => { if (net) $("ovJoin").hidden = true; };
  $("btnLeave").onclick = () => { if (confirm("Вийти з сервера і прибрати його зі списку?")) { forgetServer(code); leave(); } };
  $("btnMenu").onclick = () => $("app").classList.toggle("drawer");
  $("btnAdmin").onclick = serverSettings;
  $("btnClear").onclick = () => { const c = CHANNELS.find(c => c.id === chan); if (confirm("Видалити всі повідомлення в #" + c.name + " для всіх?")) doAdmin({ a: "clear", chan }); };
  $("admClose").onclick = () => { $("ovAdmin").hidden = true; };
  setInterval(() => { if (net && myPub && adm.mutes.has(myPub)) renderChans(); }, 15000);
  $("msgs").addEventListener("click", () => $("app").classList.remove("drawer"));

  const themes = ["auto", "dark", "light"];
  let theme = store.get("theme", "auto");
  const applyTheme = () => { if (theme === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme; };
  $("btnTheme").onclick = () => { renderLook(); $("ovLook").hidden = false; };
  applyTheme(); applyLook();

  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unseen = 0; document.title = "ДіноКорд"; } });
  window.addEventListener("pagehide", () => {
    if (code) { clearTimeout(saveTimer); writeHist(code); }
    if (net) net.send({ t: "leave", id: myId });
  });
  setInterval(renderTyping, 1000);

  // iPad/iPhone: keep the app exactly the size of what's visible, so the keyboard never pushes the header off screen
  const vv = window.visualViewport;
  const fitViewport = () => {
    document.documentElement.style.setProperty("--vh", Math.round(vv ? vv.height : window.innerHeight) + "px");
    window.scrollTo(0, 0);
  };
  (vv || window).addEventListener("resize", fitViewport);
  vv?.addEventListener("scroll", fitViewport);
  fitViewport();

  $("msgs").addEventListener("scroll", () => {
    const box = $("msgs");
    if (box.scrollHeight - box.scrollTop - box.clientHeight < 60) $("toBottom").hidden = true;
  });
  $("toBottom").onclick = () => { const box = $("msgs"); box.scrollTo({ top: box.scrollHeight, behavior: "smooth" }); $("toBottom").hidden = true; };

  const hashCode = (location.hash.match(/\d{4,6}/) || [])[0];
  window.addEventListener("hashchange", () => {
    const c = (location.hash.match(/\d{4,6}/) || [])[0];
    if (!c || c === code) return;
    if (net) leave();
    $("joinCode").value = c; enter(false, true);
  });
  $("joinCode").value = hashCode || store.get("lastCode", "");
  renderMe(); renderAll();
  loadKeys().then(() => { if ($("joinCode").value.length >= 4 && (hashCode || hasHist($("joinCode").value))) enter(false, true); });
})();
</script>
</body>
</html>
